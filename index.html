function achievementsUnlockedCount(){
  if(!state.achievementTierAwarded) return 0;
  return Object.values(state.achievementTierAwarded).reduce((s,t)=> s+(t>=0?t+1:0), 0);
}
let achievementPopupQueue = [];
let battleCountdownActive = false; // true while any "3, 2, 1, TAP!" countdown is on screen - popups defer until it clears
let achievementDoubleUsedThisBatch = false;
function checkAchievements(){
  if(!state.achievementTierAwarded) state.achievementTierAwarded = {};
  const newlyUnlocked = [];
  ACHIEVEMENT_CATEGORIES.forEach(cat=>{
    const val = cat.getValue();
    let already = state.achievementTierAwarded[cat.key];
    if(already===undefined) already = -1;
    for(let t=already+1; t<cat.tiers.length; t++){
      if(val >= cat.tiers[t]){
        state.achievementTierAwarded[cat.key] = t;
        addCoins(ACHIEVEMENT_TIER_REWARDS[t]);
        newlyUnlocked.push({cat, tierIdx:t});
        if(!state.achievementUnlockOrder) state.achievementUnlockOrder = [];
        state.achievementUnlockOrder.push(cat.key);
      } else break;
    }
  });
  saveState();
  if(newlyUnlocked.length>0){
    const wasEmpty = achievementPopupQueue.length===0;
    if(wasEmpty) achievementDoubleUsedThisBatch = false; // fresh batch starting - reset the one-ad-per-sitting allowance
    achievementPopupQueue.push(...newlyUnlocked);
    if(wasEmpty) setTimeout(showNextAchievementPopup, 700); // gives the player's tap reflexes from battle a moment to settle before anything pops up
  }
}
function showNextAchievementPopup(){
  if(achievementPopupQueue.length===0) return;
  if(battleCountdownActive){ setTimeout(showNextAchievementPopup, 400); return; }
  const next = achievementPopupQueue[0];
  showAchievementPopup(next.cat, next.tierIdx, ()=>{
    achievementPopupQueue.shift();
    setTimeout(showNextAchievementPopup, 700);
  });
}
function showAchievementPopup(cat, tierIdx, onClose){
  const tierName = ACHIEVEMENT_TIER_NAMES[tierIdx];
  const color = RARITY_STYLE[RARITY_ORDER[tierIdx]].color; // same tier colors as monster rarity, per the requested style
  const reward = ACHIEVEMENT_TIER_REWARDS[tierIdx];
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal-box" style="max-width:300px;text-align:center;">
    ${celebrationHTML(true,'ACHIEVEMENT UNLOCKED!')}
    <div class="pixel md" style="margin-top:6px;">${cat.name}</div>
    <div class="hint">${cat.desc}</div>
    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:${color};margin:6px 0;">${tierName}</div>
    <div class="hint">+${formatCoins(reward)} coins</div>
    ${achievementDoubleUsedThisBatch ? '' : `<div class="buttons-row"><button class="btn cream small full" id="achDoubleBtn" disabled>Watch Ad to Double</button></div>`}
    <div class="buttons-row"><button class="btn yolk small full" id="achPopupClose" disabled>Nice!</button></div>
  </div>`;
  document.body.appendChild(overlay);
  sfxAchievement();
  setTimeout(()=>{
    const closeBtn = document.getElementById('achPopupClose'); if(closeBtn) closeBtn.disabled = false;
    const doubleBtn = document.getElementById('achDoubleBtn'); if(doubleBtn) doubleBtn.disabled = false;
  }, 600);
  let resolved = false;
  const closeOnce = ()=>{ if(resolved) return; resolved = true; overlay.remove(); onClose(); };
  document.getElementById('achPopupClose').addEventListener('click', closeOnce);
  const achDoubleBtn = document.getElementById('achDoubleBtn');
  if(achDoubleBtn) achDoubleBtn.addEventListener('click', ()=>{
    if(resolved) return;
    achDoubleBtn.disabled = true; achDoubleBtn.textContent = 'Watching ad...';
    document.getElementById('achPopupClose').disabled = true;
    showRewardedAd(()=>{
      if(resolved) return; // guards against Nice! being pressed while the simulated ad delay was still pending
      addCoins(reward); // base reward was already paid by checkAchievements - this tops it up to double
      achievementDoubleUsedThisBatch = true;
      saveState(); sfxCoin();
      showToast(`Doubled! +${formatCoins(reward)} more coins`);
      closeOnce();
    });
  });
}
let achievementsPage = 0;
const ACHIEVEMENTS_PAGE_SIZE = 5;
function renderQuests(container){
  ensureDailyQuests();
  let anyNewlySeen = false;
  state.dailyQuests.quests.forEach(q=>{ if((q.completed||q.skipped) && !q.seen){ q.seen=true; anyNewlySeen=true; } });
  if(anyNewlySeen){ saveState(); }
  const rows = state.dailyQuests.quests.map((q, idx)=>{
    const t = questTemplateFor(q);
    const diff = QUEST_DIFFICULTY.find(d=>d.key===q.difficulty);
    const progress = questCurrentProgress(q);
    const done = q.completed || q.skipped;
    const pct = Math.max(0, Math.min(100, Math.round(100*progress/q.target)));
    const skipUsed = state.dailyQuests.skipsUsed[q.difficulty];
    return `<div class="log-row" style="flex-direction:column; align-items:stretch; gap:2px;${done?'opacity:.5;':''}">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="log-name" style="font-size:12.5px;">${t.label(q.target)}</div>
        <div class="log-status" style="background:${done?'#8a8a8a':diff.color};">${diff.label}</div>
      </div>
      <div class="hint">Reward: ${formatCoins(diff.coins)} coins, ${formatCoins(diff.xp)} Hunter XP</div>
      <div class="sat-bar"><div class="sat-fill" style="width:${pct}%; background:${done?'#3f9142':diff.color};"></div></div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="hint">${q.skipped? 'Skipped' : q.completed? 'Complete! (renews tomorrow)' : `${progress}/${q.target}`}</div>
        ${done? '' : `<button class="btn tiny cream" data-quest-skip="${idx}" ${skipUsed?'disabled':''}>${skipUsed?'Skip used today':'Watch Ad to Skip'}</button>`}
      </div>
    </div>`;
  }).join('');
  container.innerHTML = `<div class="hint" style="margin-bottom:6px;">New quests every day - complete all three for the full haul, or skip one of each difficulty if you're stuck.</div>${rows}`;
  container.querySelectorAll('[data-quest-skip]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.disabled) return;
      btn.disabled = true; btn.textContent = 'Watching ad...';
      setTimeout(()=>{
        const q = state.dailyQuests.quests[Number(btn.dataset.questSkip)];
        skipQuest(q);
        renderQuests(container);
      }, 2000);
    });
  });
}
function renderAchievements(container){
  if(!state.achievementTierAwarded) state.achievementTierAwarded = {};
  const totalPages = Math.max(1, Math.ceil(ACHIEVEMENT_CATEGORIES.length/ACHIEVEMENTS_PAGE_SIZE));
  achievementsPage = Math.min(achievementsPage, totalPages-1);
  const pageItems = ACHIEVEMENT_CATEGORIES.slice(achievementsPage*ACHIEVEMENTS_PAGE_SIZE, achievementsPage*ACHIEVEMENTS_PAGE_SIZE+ACHIEVEMENTS_PAGE_SIZE);
  container.innerHTML = `<div class="page-bar"><button class="btn tiny cream" id="achPrev" ${achievementsPage===0?'disabled':''}>${iconChevron('left')}</button><span class="pixel sm">${achievementsPage+1}/${totalPages}</span><button class="btn tiny cream" id="achNext" ${achievementsPage>=totalPages-1?'disabled':''}>${iconChevron('right')}</button></div>
    <div id="achList" style="margin-top:6px;"></div>`;
  document.getElementById('achPrev').addEventListener('click', ()=>{ if(achievementsPage===0) return; achievementsPage=Math.max(0,achievementsPage-1); renderAchievements(container); });
  document.getElementById('achNext').addEventListener('click', ()=>{ if(achievementsPage>=totalPages-1) return; achievementsPage=Math.min(totalPages-1,achievementsPage+1); renderAchievements(container); });
  document.getElementById('achList').innerHTML = pageItems.map(cat=>{
    const val = cat.getValue();
    let awarded = state.achievementTierAwarded[cat.key];
    if(awarded===undefined) awarded = -1;
    const nextTierIdx = awarded+1;
    const maxed = nextTierIdx >= cat.tiers.length;
    const nextThreshold = cat.tiers[maxed ? 4 : nextTierIdx];
    const prevThreshold = nextTierIdx>0 ? cat.tiers[nextTierIdx-1] : 0;
    const pct = maxed ? 100 : Math.max(0, Math.min(100, Math.round(100*(val-prevThreshold)/(nextThreshold-prevThreshold))));
    const tierName = awarded>=0 ? ACHIEVEMENT_TIER_NAMES[awarded] : 'Locked';
    const tierColor = awarded>=0 ? RARITY_STYLE[RARITY_ORDER[awarded]].color : '#999';
    return `<div class="log-row" style="flex-direction:column; align-items:stretch; gap:2px;cursor:pointer;" data-goal-key="${cat.key}">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:7px;">
          <div class="cat-badge" style="background:${tierColor==='#999'?'#8FA998':tierColor};width:24px;height:24px;">${achievementIcon(cat.key)}</div>
          <div class="log-name" style="font-size:12.5px;">${cat.name}</div>
        </div>
        <div class="log-status" style="background:${tierColor};">${tierName}</div>
      </div>
      <div class="hint" style="line-height:1.25;">${cat.desc}</div>
      <div class="sat-bar"><div class="sat-fill" style="width:${pct}%; background:${tierColor==='#999'?'#8FA998':tierColor};"></div></div>
      <div class="hint" style="text-align:right;">${maxed? 'MAX' : `${Math.min(val,nextThreshold)}/${nextThreshold}`}</div>
    </div>`;
  }).join('');
  document.getElementById('achList').querySelectorAll('[data-goal-key]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const cat = ACHIEVEMENT_CATEGORIES.find(c=>c.key===row.dataset.goalKey);
      const awarded = state.achievementTierAwarded[cat.key];
      const tierColor = awarded>=0 ? RARITY_STYLE[RARITY_ORDER[awarded]].color : '#8FA998';
      const visual = `<div class="cat-badge" style="background:${tierColor};width:44px;height:44px;margin:0 auto 8px;">${achievementIcon(cat.key)}</div>`;
      const nextTierIdx = (awarded===undefined?-1:awarded)+1;
      const maxed = nextTierIdx >= cat.tiers.length;
      const progress = maxed ? 'MAX tier reached.' : `Currently ${Math.min(cat.getValue(),cat.tiers[nextTierIdx])}/${cat.tiers[nextTierIdx]} towards the next tier.`;
      showItemDetailPopupCustom(cat.name, visual, `${cat.guide} ${progress}`);
    });
  });
}

function rankRibbonLabel(rank){
  // rank.name already embeds its own stars (e.g. "Marshal \u2605\u2605\u2605 Silver") - strip the
  // trailing tier-colour word since the stars get recoloured below instead of spelling it out.
  const stripped = rank.name.replace(/\s*(Bronze|Silver|Gold)\s*$/,'');
  const starMatch = stripped.match(/^(.*?)\s*(\u2605+)\s*$/);

const EASTER_EGG_REQUIRED_STEPS = {
  egg1: ['a','b','c'],
  egg2: ['a','b','c','d'],
  egg3: ['a','b','c','d','e'],
};
function markEasterEggStep(eggKey, stepKey){
  if(!state.easterEggSteps) state.easterEggSteps={};
  if(!state.easterEggSteps[eggKey]) state.easterEggSteps[eggKey]={};
  if(state.easterEggSteps[eggKey][stepKey]) return false; // already marked - idempotent, and tells the caller nothing new happened
  state.easterEggSteps[eggKey][stepKey]=true;
  saveState();
  const steps = state.easterEggSteps[eggKey];
  const required = EASTER_EGG_REQUIRED_STEPS[eggKey] || ['a','b','c'];
  if(required.every(k=>steps[k])) discoverEasterEgg(eggKey);
  return true;
}
function easterEggStepDone(eggKey, stepKey){
  return !!(state.easterEggSteps && state.easterEggSteps[eggKey] && state.easterEggSteps[eggKey][stepKey]);
}
function discoverEasterEgg(key){
  if((state.easterEggsFound||[]).includes(key)) return; // already found - never re-triggers
  if(!state.easterEggsFound) state.easterEggsFound=[];
  state.easterEggsFound.push(key);
  const discoveryNumber = state.easterEggsFound.length; // 1, 2, or 3 - order found, not which egg
  saveState();
  showEasterEggBanner(discoveryNumber);
}

function applyEasterEggReward(discoveryNumber){
  const reward = EASTER_EGG_REWARDS[discoveryNumber-1];
  addCoins(reward.coins);
  if(reward.hunterXP) addHunterXP(reward.hunterXP);
  if(reward.levelUpAll){
    state.collection.forEach(m=>{
      const cap = MAX_LEVEL_BY_RARITY[m.rarity];
      m.level = Math.min(cap, m.level + reward.levelUpAll);
      m.xp = 0;
      recomputeStats(m);
    });
  }
  if(reward.unlockSkins){
    if(!state.ownedSkins) state.ownedSkins=[];
    reward.unlockSkins.forEach(k=>{ if(!state.ownedSkins.includes(k)) state.ownedSkins.push(k); });
  }
  Object.entries(reward.items).forEach(([key,qty])=>{ state.inventory[key] = (state.inventory[key]||0)+qty; });
  saveState();
}

function effectiveStats(m){
  const s = { hp:m.stats.hp, power:m.stats.power, guard:m.stats.guard, speed:m.stats.speed };
  (m.equipped||[]).forEach(key=>{
    const it = UPGRADE_ITEMS.find(u=>u.key===key); if(!it) return;
    if(it.stat==='all'){ s.hp+=it.bonus; s.power+=it.bonus; s.guard+=it.bonus; s.speed+=it.bonus; }
    else if(it.stat!=='rest'){ s[it.stat] += it.bonus; }
  });
  if(m.weapon){ const w = WEAPON_ITEMS.find(w=>w.key===m.weapon); if(w) s.power += w.bonus; }
  if(m.armor){ const a = ARMOR_ITEMS.find(a=>a.key===m.armor); if(a) s.guard += a.bonus; }
  if(m.shield){ const sh = SHIELD_ITEMS.find(x=>x.key===m.shield); if(sh) s.guard += sh.bonus; }
  return s;
}
function effectiveStatsWithBuff(m){
  const fs = effectiveStats(m);
  const buff = m.buffNextBattle;
  if(buff && buff.power) fs.power = Math.round(fs.power*buff.power);
  if(buff && buff.guard) fs.guard = Math.round(fs.guard*buff.guard);
  if(buff && buff.hp) fs.hp = Math.round(fs.hp*buff.hp);
  if(buff && buff.powerAdd) fs.power += buff.powerAdd;
  if(buff && buff.guardAdd) fs.guard += buff.guardAdd;
  if(buff && buff.hpAdd) fs.hp += buff.hpAdd;
  return fs;
}

function computeSquadAnalysis(){

  if(_squadAnalysisCache && _squadAnalysisCacheSig===sig) return _squadAnalysisCache;

function computeSquadAnalysisUncached(squad){
  if(squad.length===0) return {issues:[], benchSuggestion:null, empty:true};
  const dismissed = state.squadAnalysisDismissed || {};
  const issues = [];
  let smallSquadIssue = null;
  if(squad.length<5){
    smallSquadIssue = {
      id:'smallSquad', kind:'smallSquad', priority:0,
      headline: squad.length===1 ? 'Only 1 Skrambeast favourited' : `Only ${squad.length} Skrambeasts favourited`,
      detail: `You can favourite up to 5. A full squad means more chances before a fight ends.`,
      color:'#a13a24'
    };
    issues.push(smallSquadIssue);
  }
  const typeCounts = {};
  squad.forEach(m=> typeCounts[m.type] = (typeCounts[m.type]||0)+1);
  const dominantType = Object.keys(typeCounts).reduce((a,b)=> typeCounts[b]>typeCounts[a]?b:a, squad[0].type);
  const counterType = Object.keys(TYPE_ADVANTAGE).find(k=>TYPE_ADVANTAGE[k]===dominantType);
  let typeIssue = null;
  if(typeCounts[dominantType]>=3 && !squad.some(m=>m.type===counterType)){
    typeIssue = {
      id:`type:${dominantType}:${counterType}`, kind:'type', priority:2,
      headline:`Heavy on ${TYPES.find(t=>t.key===dominantType).label}`,
      detail:`${typeCounts[dominantType]} of your 5 share a type, and nothing in your squad covers ${TYPES.find(t=>t.key===counterType).label}, which beats it.`,
      color: TYPES.find(t=>t.key===dominantType).color
    };
    issues.push(typeIssue);
  }
  squad.forEach(m=>{
    if(!m.weapon && !m.armor && !m.shield){
      issues.push({
        id:`gear:${m.id}`, kind:'gear', priority:3,
        headline:`${m.name} is unequipped`,
        detail:`No weapon, armour, or shield, while the rest of your squad is geared up.`,
        color:'#8FA998'
      });
    }
  });
  let weakLinkIssue = null;
  if(squad.length>1){
    const topLevel = Math.max(...squad.map(m=>m.level));
    const weakLink = squad.filter(m=> m.level < topLevel*0.7).sort((a,b)=>a.level-b.level)[0];
    if(weakLink){
      weakLinkIssue = {
        id:`weakLink:${weakLink.id}`, kind:'weakLink', priority:1,
        headline:`${weakLink.name} is far behind`,
        detail:`Level ${weakLink.level}, well under your squad's top level of ${topLevel}. Likely to faint first in multi-fighter battles.`,
        color:'#a13a24',
        monster: weakLink
      };
      issues.push(weakLinkIssue);
    }
  }
  const totalPower = squad.reduce((s,m)=> s+effectiveStats(m).power, 0);
  const totalGuard = squad.reduce((s,m)=> s+effectiveStats(m).guard, 0);
  if(totalPower>0 && totalGuard>0){
    const ratio = totalPower/totalGuard;
    if(ratio>=1.4) issues.push({id:'lean:offence', kind:'lean', priority:4, headline:'Offence-heavy squad', detail:'Your squad leans heavily offensive overall - could be intentional.', color:'#E8542E'});
    else if(ratio<=1/1.4) issues.push({id:'lean:defence', kind:'lean', priority:4, headline:'Defence-heavy squad', detail:'Your squad leans heavily defensive overall - could be intentional.', color:'#4E8FD1'});
  }
  const undismissed = issues.filter(i=> !dismissed[i.id]);
  undismissed.sort((a,b)=>a.priority-b.priority);
  const topIssues = undismissed.slice(0,3);
  let benchSuggestion = null;
  const bench = state.collection.filter(m=>!m.favorite);
  if(smallSquadIssue && topIssues.includes(smallSquadIssue)){
    const strongest = bench.filter(m=>!monsterOnMission(m)).sort((a,b)=>b.level-a.level)[0];
    if(strongest) benchSuggestion = {monster:strongest, reason:'Your strongest available Skrambeast not already in the squad'};
  } else if(weakLinkIssue && topIssues.includes(weakLinkIssue)){
    const better = bench.filter(m=>m.level>weakLinkIssue.monster.level).sort((a,b)=>b.level-a.level)[0];
    if(better) benchSuggestion = {monster:better, reason:`Higher level than ${weakLinkIssue.monster.name}`};
  } else if(typeIssue && topIssues.includes(typeIssue)){
    const coverMon = bench.filter(m=>m.type===counterType).sort((a,b)=>b.level-a.level)[0];
    if(coverMon) benchSuggestion = {monster:coverMon, reason:`Covers the missing ${TYPES.find(t=>t.key===counterType).label} type`};
  }
  return {issues:topIssues, benchSuggestion, empty:false};
}

// Checks whether a running mission has crossed its next unresolved checkpoint, pausing it if so -

const MISSION_STUCK_FORFEIT_MS = 12*3600000;
function updateMissionCheckpoints(){
  state.missions.forEach((slot,i)=>{
    if(!slot) return;
    if(slot.status==='needsBattle'){
      if(Date.now()-slot.pausedAt > MISSION_STUCK_FORFEIT_MS){
        const monster = state.collection.find(m=>m.id===slot.monsterId);
        if(monster) monster.tiredUntil = Date.now()+5*60000;
        state.missions[i] = null;
        saveState();
      }
      return;
    }
    const idx = slot.checkpointsResolved||0;
    if(idx>=slot.checkpoints.length) return;
    const raw = (Date.now()-slot.startedAt)/slot.durationMs;
    if(raw>=slot.checkpoints[idx]){ slot.status='needsBattle'; slot.pausedAt=Date.now(); saveState(); }
  });

  slot.status = 'inProgress';

    tapZone.classList.remove('tap-pulse'); void tapZone.offsetWidth; tapZone.classList.add('tap-pulse');
    updateBars();
  }
  function finish(won){
    if(resolved) return; resolved=true;
    clearInterval(opponentTimer); clearInterval(autoFighterTimer);
    tapZone.removeEventListener('click', onTap);
    onResolve(won);
  }
  battleCountdownActive = true;
  const steps=['3','2','1','TAP!']; let si=0;
  const showStep=()=>{
    if(si>=steps.length){
      countdownEl.textContent='';
      battleCountdownActive = false;
      tapZone.addEventListener('click', onTap);
      autoFighterTimer = maybeStartAutoFighter(onTap);
      opponentTimer = setInterval(opponentTick, Math.max(550, opponentTickInterval(opponent)));
      return;
    }
    countdownEl.textContent=steps[si];
    countdownEl.classList.remove('cd-pop'); void countdownEl.offsetWidth; countdownEl.classList.add('cd-pop');
    si++; setTimeout(showStep,750);
  };

}

function captureChance(m, itemBonus, battleCount){
  const cap = MAX_LEVEL_BY_RARITY[m.rarity];
  let chance = CAPTURE_BASE[m.rarity] * (1 - 0.35*(m.level/cap));
  chance += (itemBonus||0) + ((battleCount||0)*0.18) + activeBoostMult('capture');
  return Math.max(0.03, Math.min(1, chance));
}
function coinsForRarity(r){ return {common:20, uncommon:45, rare:90, epic:170, legendary:320}[r] || 20; }
function arenaCoinReward(level, rarity){
  return Math.round(coinsForRarity(rarity) * (0.5 + (level||1)/100));
}

  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+'s ago'; if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago';

let tourSteps = [], tourStepIndex = 0, tourOnComplete = null;
function startTour(steps, onComplete){
  tourSteps = steps;
  tourStepIndex = 0;
  tourOnComplete = onComplete || null;
  showTourStep();
}
function endTour(){
  const existing = document.getElementById('tourOverlay');
  if(existing) existing.remove();
  const cb = tourOnComplete;
  tourSteps = []; tourStepIndex = 0; tourOnComplete = null;
  if(cb) cb();
}
function showTourStep(){
  const existing = document.getElementById('tourOverlay');
  if(existing) existing.remove();
  if(tourStepIndex >= tourSteps.length){ endTour(); return; }
  const step = tourSteps[tourStepIndex];
  const target = document.querySelector(step.targetSelector);
  if(!target){ tourStepIndex++; showTourStep(); return; } // safety net - skip a step if its target isn't on screen right now
  const rect = target.getBoundingClientRect();
  const pad = 6;
  const holeTop = rect.top-pad, holeLeft = rect.left-pad, holeW = rect.width+pad*2, holeH = rect.height+pad*2;
  const spaceBelow = window.innerHeight - (holeTop+holeH);
  const bubbleGoesBelow = spaceBelow > holeTop;
  const bubbleStyle = bubbleGoesBelow
    ? `top:${holeTop+holeH+14}px;`
    : `top:${Math.max(10, holeTop-14)}px;transform:translate(-50%,-100%);`;
  const overlay = document.createElement('div');
  overlay.id = 'tourOverlay'; overlay.className = 'tour-overlay';
  overlay.innerHTML = `
    <div class="tour-hole" style="top:${holeTop}px;left:${holeLeft}px;width:${holeW}px;height:${holeH}px;"></div>
    <div class="tour-bubble" style="${bubbleStyle}">
      ${bubbleGoesBelow?`<div class="tour-arrow tour-arrow-up"></div>`:''}
      <div class="pixel sm">${step.title}</div>
      <div class="hint" style="margin-top:4px;">${step.text}</div>
      <div class="buttons-row" style="margin-top:8px;">
        <button class="btn cream small" id="tourSkipBtn">Skip</button>
        <button class="btn yolk small" id="tourNextBtn">${tourStepIndex===tourSteps.length-1?'Done':'Next'}</button>
      </div>
      ${bubbleGoesBelow?'':'<div class="tour-arrow tour-arrow-down"></div>'}
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('tourNextBtn').addEventListener('click', ()=>{ tourStepIndex++; showTourStep(); });
  document.getElementById('tourSkipBtn').addEventListener('click', endTour);
}

function startNoise(canvas, blackedOut){
  const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
  const draw = ()=>{
    const img = ctx.createImageData(w,h);
    for(let i=0;i<img.data.length;i+=4){
      const v = blackedOut ? (Math.random()<0.08 ? Math.random()*255 : 0) : Math.random()*255;
      img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=255;
    }
    ctx.putImageData(img,0,0);
  };
  draw(); noiseTimer = setInterval(draw, 90);
}

async function startCamera(){
  if(scannerSetupActive) return;
  if(CAMERA_BLOCKED_REASON){
    idleScreen();
    showToast(CAMERA_BLOCKED_REASON==='file' ? "Local files can't access the camera - type the barcode instead" : "Needs a secure (https) address for the camera - type the barcode instead");
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showToast("Camera not available here - type a barcode instead"); return; }
  capturingScreen();
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    const video = document.getElementById('camVideo'); video.srcObject = cameraStream;
    if(barcodeDetectorSupported){
      const detector = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
      const scanLoop = async () => {
        if(!cameraStream) return;
        try{
          const codes = await detector.detect(video);
          if(codes.length>0){ const code = codes[0].rawValue; if(isValidBarcode(code)){ stopCamera(); handleScan(code); return; } }
        }catch(e){}
        requestAnimationFrame(scanLoop);
      };
      requestAnimationFrame(scanLoop);
    } else { showToast("This browser can't auto-read barcodes - type it in below"); }
  }catch(e){
    if(e.name==='NotAllowedError'){ showToast("Camera permission denied - type a barcode instead"); }
    else { showToast("Camera blocked in this preview - try the downloaded file in a full tab, or type a barcode"); }
    idleScreen();
  }
}
function stopCamera(){ if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; } }

function handleScan(barcode){
  stopCamera();
  if(state.activeBoss && !state.activeBoss.revealed){
    showBossDetectedPopup();
    return;
  }
  if(state.activeBoss && state.activeBoss.awaitingCapture){
    showToast("You still need to decide on the Queen you just defeated!");
    renderTab();
    return;
  }
  const existingOwned = state.collection.find(m=>m.barcode===barcode);
  const wasDiscarded = state.discarded.includes(barcode);
  const pendingEgg = (state.eggs||[]).find(e=>e.barcode===barcode);
  if(pendingEgg){ renderEggAlreadyIncubating(pendingEgg); sfxScan(); return; }
  const forceRarity = (state.nextCatchGuaranteed && !existingOwned) ? 'legendary' : null;
  if(!existingOwned && !forceRarity && (state.eggs||[]).length<5 && Math.random()<EGG_CHANCE){
    const rng = mulberry32(hashCode(barcode+'-eggtier'));
    const rarity = rollEggTier(rng);
    const egg = { barcode, rarity, readyAt: Date.now()+EGG_WAIT_MS[rarity] };
    if(!state.eggs) state.eggs=[];
    state.eggs.push(egg);
    saveState(); sfxScan();
    renderEggFound(egg);
    return;
  }
  const wild = generateMonster(barcode, forceRarity);
  if(forceRarity){ state.nextCatchGuaranteed=false; saveState(); }
  if(!existingOwned) logAlmanac(wild, 'seen');
  encounter = { monster: wild, isDuplicate: !!existingOwned, weakened:false };
  sfxScan();
  renderEncounter(wasDiscarded);
}

/* ---- Single-fighter battles: used by duplicate encounters, capture-first, and arena ---- */
const TAP_BASE_INTERVAL = {common:950, uncommon:800, rare:650, epic:500, legendary:380}; // ms between opponent auto-attacks - lower rarity = slower, more forgiving rhythm
const TAP_BATTLE_MAX_MS = 20000; // safety cap so a battle can never hang forever
const TAP_MIN_GAP_MS = 90; // debounces taps faster than this so it stays skill-based, not just "hold as fast as possible"
const AUTO_FIGHTER_INTERVAL_MS = 700; // deliberately well below optimal human tap rate - an accessibility option, not a strategy upgrade
function maybeStartAutoFighter(onTapFn){
  if(!state.settings.autoFighter) return null;
  return setInterval(onTapFn, AUTO_FIGHTER_INTERVAL_MS);
}
function opponentTickInterval(wild){
  const base = TAP_BASE_INTERVAL[wild.rarity]||800;
  const cap = MAX_LEVEL_BY_RARITY[wild.rarity];
  const levelFactor = 1 - (wild.level/cap)*0.25; // up to 25% faster near the top of its own rarity band
  return Math.max(220, Math.round(base*levelFactor));
}
// Builds and runs a full interactive tap battle inside targetEl, using suffix to namespace
// element IDs so wild encounters ('') and Arena ('A') can share this one implementation
// while staying compatible with the existing finishEncounterBattle/finishArenaBattle.
const SPECIAL_BAR_SEGMENTS = 6;
const SPECIAL_BAR_HITS_PER_SEGMENT = 1;
function specialBarHTML(idPrefix){
  let segs = '';
  for(let i=0;i<SPECIAL_BAR_SEGMENTS;i++) segs += `<div class="special-bar-seg" id="${idPrefix}-seg-${i}"></div>`;
  return `<div style="text-align:center;"><div style="font-size:9px;color:#4c5443;opacity:.8;font-family:'Rubik',sans-serif;">SPECIAL</div><div class="special-bar" id="${idPrefix}-bar">${segs}</div></div>`;
}
function createSpecialAttackController(idPrefix, tapZoneEl, opponentContainerEl, onSpecialAttack){
  let hits=0, filledSegs=0, ready=false;
  const maxHits = SPECIAL_BAR_SEGMENTS*SPECIAL_BAR_HITS_PER_SEGMENT;
  function updateSegs(){
    for(let i=0;i<SPECIAL_BAR_SEGMENTS;i++){
      const el = document.getElementById(`${idPrefix}-seg-${i}`);
      if(el) el.classList.toggle('filled', i<filledSegs);
    }
  }
  return {
    registerHit(){
      if(ready) return;
      hits++;
      filledSegs = Math.min(SPECIAL_BAR_SEGMENTS, Math.floor(hits/SPECIAL_BAR_HITS_PER_SEGMENT));
      updateSegs();
      if(hits>=maxHits){ ready = true; tapZoneEl.classList.add('special-ready'); }
    },
    isReady(){ return ready; },
    // Called at the top of a tap handler - if a special was ready, this consumes it (resets the bar,
    // plays the impact effect on the opponent, and fires the callback) and returns true so the caller
    // knows to skip its own normal-hit logic for this tap. Returns false otherwise, so the caller
    // proceeds as normal and calls registerHit() after dealing damage, same as before.
    consumeIfReady(){
      if(!ready) return false;
      ready = false; hits=0; filledSegs=0; updateSegs();
      tapZoneEl.classList.remove('special-ready');
      const boom = document.createElement('div');
      boom.className = 'special-explosion'; boom.innerHTML = '<span></span>';
      opponentContainerEl.appendChild(boom);
      setTimeout(()=> boom.remove(), 550);
      onSpecialAttack();
      return true;
    }
  };
}
const HIVE_CHECKPOINT_INTERVAL = 25;
const HIVE_HP_REGEN_PCT = 0.08; // partial recovery after each win - not full healing, just enough to make a long run survivable for a well-prepared monster
const HIVE_SHOP_ITEMS = [
  {key:'hp', name:'+50 HP', desc:'Extra health for this stretch of waves', longDesc:'Adds 50 to your Skrambeast\'s max HP for every wave until your next checkpoint. Since there\'s no healing in The Hive, extra HP directly extends how long you can last.', icon:iconHeart, buff:{hpAdd:50}},
  {key:'power', name:'+50 Power', desc:'Hit harder for this stretch of waves', longDesc:'Adds 50 Power for every wave until your next checkpoint - you\'ll clear opponents faster and take less cumulative damage along the way.', icon:iconSword, buff:{powerAdd:50}},
  {key:'defense', name:'+50 Defense', desc:'Take less damage for this stretch of waves', longDesc:'Adds 50 Guard for every wave until your next checkpoint, reducing how much damage each hit you take actually lands for.', icon:iconShield, buff:{guardAdd:50}},
  {key:'luck', name:'Lucky Charm', desc:'Better loot chance for this stretch of waves', longDesc:'Boosts your loot drop chance by 60% for every wave until your next checkpoint - more potions found along the way.', icon:iconClover, buff:null, luck:true},
  {key:'reflect', name:'Reflect Damage', desc:'25% chance per hit taken to bounce 50% of it back', longDesc:'For every wave until your next checkpoint, any hit you take has a 1-in-4 chance to bounce half its damage straight back at the opponent.', icon:iconReflect, buff:{reflect:{chance:0.25, mult:0.5}}},
];
function hiveWaveLevel(wave){ return Math.min(150, 1+Math.floor(wave*0.42)); }
function hiveWaveRarity(wave){
  const t = Math.min(1, wave/550);
  const weights = {
    common: Math.max(0, 1-t*1.3),
    uncommon: Math.max(0, 0.6-Math.abs(t-0.25)*1.2),
    rare: Math.max(0, 0.6-Math.abs(t-0.5)*1.2),
    epic: Math.max(0, 0.6-Math.abs(t-0.75)*1.2),
    legendary: Math.max(0, (t-0.6)*2.5)
  };
  const total = Object.values(weights).reduce((a,b)=>a+b,0);
  let roll = Math.random()*total;
  for(const [rarity,w] of Object.entries(weights)){ if(roll<w) return rarity; roll-=w; }
  return 'legendary';
}
function rollHiveLoot(){
  const pool = POTION_ITEMS.filter(p=>!p.specialist);
  return pool[Math.floor(Math.random()*pool.length)].key;
}
function generateHiveQueen(wave){

  boss.traits = Object.assign({}, boss.traits, {eyes:'sharp'});
  boss.weapon = 'skybreakerFang';
  boss.armor = 'gildedRoyalArmor';

  boss.stats.hp = Math.round(boss.stats.hp*1.5);
  boss.stats.power = Math.round(boss.stats.power*1.3);
  boss.stats.guard = Math.round(boss.stats.guard*1.2);
  boss.name = 'Queen '+boss.name;
  boss.defaultName = boss.name;
  boss.isBoss = true;
  return boss;
}
function raidHpMultiplier(partySize){ return 1 + (Math.max(1,partySize)-1)*0.75; }
function generateRaidQueen(partySize){
  const barcode = 'raidqueen-'+Date.now()+'-'+Math.floor(Math.random()*100000);

  boss.isBoss = true;
  return boss;
}
function applyHiveOpponentGear(opponent, wave){
  if(wave<50) return; // no gear before this point - keeps the early game clean
  const gearChance = Math.min(0.6, Math.max(0, (wave-50)/300));
  if(Math.random()<gearChance){
    const eligible = WEAPON_ITEMS.filter(w=>(w.reqLevel||0)<=opponent.level && !w.specialist);
    if(eligible.length){
      const w = eligible[Math.floor(Math.random()*eligible.length)];
      opponent.weapon = w.key;
      opponent.stats.power += w.bonus;
    }
  }
  if(Math.random()<gearChance){
    const eligible = ARMOR_ITEMS.filter(a=>(a.reqLevel||0)<=opponent.level && !a.specialist);
    if(eligible.length){
      const a = eligible[Math.floor(Math.random()*eligible.length)];
      opponent.armor = a.key;
      opponent.stats.guard += a.bonus;
    }
  }
}
function renderHive(container){
  const favs = favoritedSquad();
  const backBtnHtml = `<div class="buttons-row"><button class="btn yolk small full" id="hiveBackToArenaBtn">Back to Battle Tab</button></div>`;
  if(state.settings.autoFighter){
    container.innerHTML = `<div class="hint" style="color:#a13a24;text-align:center;padding:10px 0;">The Hive isn't available with Auto Fighter enabled - turn it off in Settings to enter.</div>${backBtnHtml}`;
    document.getElementById('hiveBackToArenaBtn').addEventListener('click', ()=>{ versusCategory='menu'; renderVersus(document.getElementById('panel')); });
    return;
  }
  if(favs.length===0){
    container.innerHTML = `<div class="hint" style="color:#a13a24;text-align:center;padding:10px 0;">You need at least 1 favourite in your Squad to enter The Hive.</div><div class="buttons-row"><button class="btn cream small full" id="hiveGoSquad">Go to Squad</button></div>${backBtnHtml}`;
    document.getElementById('hiveGoSquad').addEventListener('click', ()=> switchTab('collection'));
    document.getElementById('hiveBackToArenaBtn').addEventListener('click', ()=>{ versusCategory='menu'; renderVersus(document.getElementById('panel')); });
    return;
  }
  container.innerHTML = `
    <div class="hint">Choose one Skrambeast to send into The Hive. No healing, no switching - just them, wave after wave, until they fall. Any active potions or bonuses will be cleared on entry.</div>
    <div class="arena-roster" id="hiveRoster" style="flex-wrap:wrap;margin-top:8px;gap:6px;"></div>
    <div class="buttons-row"><button class="btn coral small full" id="hiveStartBtn" disabled>Enter The Hive</button></div>
    ${state.stats.hiveBestKillCount ? `<div class="hint" style="text-align:center;margin-top:6px;">Your best: ${state.stats.hiveBestKillCount} kills</div>` : ''}
    ${backBtnHtml}`;
  document.getElementById('hiveBackToArenaBtn').addEventListener('click', ()=>{ versusCategory='menu'; renderVersus(document.getElementById('panel')); });
  const rosterEl = document.getElementById('hiveRoster');
  let selectedId = null;
  rosterEl.innerHTML = favs.map(m=> `<div class="arena-roster-icon${isTired(m)?' tired':''}" data-fid="${m.id}" style="flex:0 0 auto;width:60px;"><div style="width:28px;height:28px;">${monsterSVG(m,28)}</div><span class="pixel sm">Lv.${m.level}</span></div>`).join('');
  rosterEl.querySelectorAll('[data-fid]').forEach(el=>{
    if(el.classList.contains('tired')) return;
    el.addEventListener('click', ()=>{
      rosterEl.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
      selectedId = el.dataset.fid;
      document.getElementById('hiveStartBtn').disabled = false;
    });
  });
  document.getElementById('hiveStartBtn').addEventListener('click', ()=>{
    const fighter = state.collection.find(m=>m.id===selectedId);
    if(fighter) startHiveRun(fighter, container);
  });
}
function startHiveRun(fighter, container){
  hiveRunActive = true;
  fighter.buffNextBattle = null; // wipe any existing potion/battle buffs before entry
  let kills = 0, totalXp = 0, totalCoins = 0;
  const lootCounts = {};
  let activeShopBuff = null, luckActive = false;
  let carriedHp = null; // null = full HP for wave 1 only; every wave after carries over whatever's left, since there's no healing

  function runNextWave(){
    const wave = kills+1;
    const isQueenWave = wave>=300 && (wave-300)%12===0;
    const level = hiveWaveLevel(wave);
    const rarity = hiveWaveRarity(wave);
    const fakeBarcode = 'hive-'+Date.now()+'-'+Math.floor(Math.random()*100000);
    const opponent = isQueenWave ? generateHiveQueen(wave) : generateMonster(fakeBarcode, rarity, level, true);
    if(fighter.isBoss){
      opponent.stats.power = Math.round(opponent.stats.power*1.15);
      opponent.stats.guard = Math.round(opponent.stats.guard*1.15);
      opponent.stats.hp = Math.round(opponent.stats.hp*1.15);
    }
    if(!isQueenWave) applyHiveOpponentGear(opponent, wave);
    logAlmanac(opponent, 'seen');
    fighter.buffNextBattle = activeShopBuff; // re-applied every wave since runTapBattle consumes it on each call
    const maxHp = effectiveStatsWithBuff(fighter).hp;
    const hpLabel = carriedHp!=null ? `${carriedHp}/${maxHp} HP` : `${maxHp}/${maxHp} HP`;
    const killHpLabel = `<div style="font-size:9px;color:#4c5443;opacity:.8;font-family:'Rubik',sans-serif;text-align:center;">Kills: ${kills} · ${hpLabel}</div>`;
    const queenBanner = isQueenWave ? `<div class="pixel sm" style="position:absolute;top:2px;right:2px;z-index:2;background:#D4A017;color:#1A1F1C;padding:3px 7px;border-radius:6px;font-size:10px;">👑 QUEEN WAVE</div>` : '';
    container.innerHTML = `${killHpLabel}<div style="position:relative;">${queenBanner}<div id="hiveBattleHost"></div></div>`;
    runTapBattle(fighter, opponent, document.getElementById('hiveBattleHost'), 'Hive', (result)=>{
      carriedHp = result.remainingFHp;
      trackBattleResult(result.won, opponent);
      if(result.oneHitKO){ state.stats.oneHitKOs=(state.stats.oneHitKOs||0)+1; showToast("ONE-HIT KO! Bonus XP and coins"); }
      if(result.won){
        const maxHpNow = effectiveStatsWithBuff(fighter).hp;
        kills++;
        const rewardMult = isQueenWave ? 3 : 1;
        const xpGain = Math.round((20+wave*1.5)*rewardMult);
        const coinGain = Math.round((15+wave*1.2)*rewardMult);
        totalXp += xpGain; totalCoins += coinGain;
        addCoins(coinGain);
        grantXP(fighter, xpGain);
        if(rarity==='legendary' && !isQueenWave) state.stats.hiveLegendaryWins = (state.stats.hiveLegendaryWins||0)+1;
        if(isQueenWave) state.stats.hiveQueensBeaten = (state.stats.hiveQueensBeaten||0)+1;
        let thisWaveLoot = null;
        if(isQueenWave && Math.random()<0.125){
          state.inventory.queensCrown = (state.inventory.queensCrown||0)+1;
          state.stats.crownsLifetime = (state.stats.crownsLifetime||0)+1;
          lootCounts.queensCrown = (lootCounts.queensCrown||0)+1;
          thisWaveLoot = 'queensCrown';
          checkAchievements();
        } else {
          const lootChance = Math.min(0.5, 0.08+wave*0.001) * (luckActive?1.6:1);
          if(Math.random()<lootChance){
            const item = rollHiveLoot();
            state.inventory[item] = (state.inventory[item]||0)+1;
            lootCounts[item] = (lootCounts[item]||0)+1;
            thisWaveLoot = item;
          }
        }
        state.stats.hiveTotalKills = (state.stats.hiveTotalKills||0)+1;
        saveState(); checkAchievements();
        showHiveWaveResult(wave, xpGain, coinGain, thisWaveLoot, result.log, maxHpNow);
      } else {
        showHiveDefeatResult(result.log);
      }
    }, true, carriedHp);
  }

  function showHiveDefeatResult(log){
    const lastLog = log.slice(-4).join('<br>');
    container.innerHTML = `
      <div class="battle-log" style="max-height:90px;">${lastLog}</div>
      ${celebrationHTML(false,'DEFEATED!')}
      <div class="hint" style="text-align:center;">${escapeHtml(fighter.name)} couldn't hold on any longer at ${kills} kills.</div>
      <div class="buttons-row" style="margin-top:22px;"><button class="btn yolk small full" id="hiveDefeatContinueBtn" disabled>Continue</button></div>`;
    const continueBtn = document.getElementById('hiveDefeatContinueBtn');
    setTimeout(()=>{ if(continueBtn) continueBtn.disabled = false; }, 600); // settling delay - matches the same tap-momentum fix used elsewhere
    continueBtn.addEventListener('click', ()=> endHiveRun(false));
  }
  function showHiveWaveResult(wave, xpGain, coinGain, thisWaveLoot, log, maxHp){
    const atCheckpoint = kills % HIVE_CHECKPOINT_INTERVAL === 0;
    const lastLog = log.slice(-3).join('<br>');
    const lootItem = thisWaveLoot==='queensCrown' ? {name:"Queen's Crown"} : (thisWaveLoot ? POTION_ITEMS.find(p=>p.key===thisWaveLoot) : null);
    container.innerHTML = `
      <div class="battle-log" style="max-height:70px;">${lastLog}</div>
      ${celebrationHTML(true,'WAVE CLEARED!')}
      <div class="hint" style="text-align:center;">+${xpGain} XP · +${formatCoins(coinGain)} coins${lootItem? ' · found '+lootItem.name+'!':''}</div>
      <div class="hint" style="text-align:center;margin-top:2px;">Kills: ${kills} · ${carriedHp}/${maxHp} HP (caught their breath - no full heal)</div>
      <div class="buttons-row" style="margin-top:55px;"><button class="btn yolk small full" id="hiveWaveContinueBtn" disabled>${atCheckpoint? 'Continue to Checkpoint':'Next Opponent'}</button></div>
      <div class="buttons-row"><button class="btn-hazard small full" id="hiveWaveReturnBtn"><span class="hazard-label">Return to Arena</span></button></div>`;
    const continueBtn = document.getElementById('hiveWaveContinueBtn');
    setTimeout(()=>{ if(continueBtn) continueBtn.disabled = false; }, 600); // settling delay - matches the same tap-momentum fix used for achievement pop-ups
    continueBtn.addEventListener('click', ()=>{
      if(atCheckpoint) showHiveCheckpoint(); else runNextWave();
    });
    document.getElementById('hiveWaveReturnBtn').addEventListener('click', ()=>{
      showConfirm(`End this Hive run at ${kills} kills? Everything you've earned so far is already safely yours - this just ends your current streak.`, ()=> endHiveRun(true), {confirmLabel:'Yes, exit', hazard:true});
    });
  }
  function showHiveCheckpoint(){
    activeShopBuff = null; luckActive = false; // the previous stretch's pick has expired
    let selectedItem = null;
    state.stats.hiveCheckpointsReached = (state.stats.hiveCheckpointsReached||0)+1; // reaching the checkpoint is the event, regardless of what gets picked here
    saveState(); checkAchievements();
    const checkpointNumber = kills / HIVE_CHECKPOINT_INTERVAL;
    const offerXpAd = checkpointNumber % 2 === 1; // alternates: checkpoint 1 offers XP, 2 offers Coins, 3 back to XP, etc.
    const adKind = offerXpAd ? 'xp' : 'coin';
    const adBoostActive = state.activeBoosts && state.activeBoosts[adKind] && Date.now()<state.activeBoosts[adKind].expiresAt;
    container.innerHTML = `
      <div class="pixel md" style="text-align:center;">Checkpoint - ${kills} kills!</div>
      <div class="hint" style="text-align:center;">Pick one free bonus for your next stretch of waves:</div>
      <div id="hiveShopList" style="margin-top:6px;"></div>
      <div class="store-item" style="margin-top:6px;"><div class="cat-badge" style="background:#3f9142;">AD</div><div class="sinfo"><div class="sname">Watch Ad for x2 ${offerXpAd?'XP':'Coins'}</div><div class="sdesc">${offerXpAd?'Doubles XP for your whole squad':'Doubles coins earned'} - 2 minutes${adBoostActive?' · already running':''}</div></div><button class="btn tiny yolk" id="hiveCheckpointAdBtn" style="font-size:11px;padding:6px 10px;" ${adBoostActive?'disabled':''}>Watch Ad</button></div>
      <div class="buttons-row"><button class="btn yolk small full" id="hiveContinueBtn">Continue Battle</button></div>
      <div class="buttons-row"><button class="btn-hazard small full" id="hiveExitBtn"><span class="hazard-label">Exit Hive</span></button></div>`;
    if(!adBoostActive){
      document.getElementById('hiveCheckpointAdBtn').addEventListener('click', function(){
        const btn = this;
        showRewardedAd(()=>{
          if(!state.activeBoosts) state.activeBoosts={};
          state.activeBoosts[adKind] = { key: offerXpAd?'hiveCheckpointXpBoost':'hiveCheckpointCoinBoost', mult:2, expiresAt: Date.now()+2*60000 };
          saveState(); sfxCoin();
          showToast(`x2 ${offerXpAd?'XP':'Coins'} boost activated!`);
          btn.disabled = true;
          const descEl = btn.parentElement.querySelector('.sdesc');
          if(descEl) descEl.textContent = `${offerXpAd?'Doubles XP for your whole squad':'Doubles coins earned'} - 2 minutes · already running`;
        });
      });
    }
    const listEl = document.getElementById('hiveShopList');
    listEl.innerHTML = HIVE_SHOP_ITEMS.map(it=> `<div class="store-item" data-shop-key="${it.key}" style="cursor:pointer;"><div style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;">${it.icon()}</div><div class="sinfo"><div class="sname">${it.name}</div><div class="sdesc">${it.desc}</div></div><button class="btn tiny cream" data-info-key="${it.key}" style="padding:3px 7px;">ⓘ</button></div>`).join('');
    listEl.querySelectorAll('[data-shop-key]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const item = HIVE_SHOP_ITEMS.find(x=>x.key===el.dataset.shopKey);
        selectedItem = item;
        listEl.querySelectorAll('.store-item').forEach(x=> x.style.boxShadow='');
        el.style.boxShadow = '0 0 0 3px #E8542E';
        if(item.luck){ luckActive = true; activeShopBuff = null; }
        else { luckActive = false; activeShopBuff = item.buff; }
        showToast(`${item.name} selected for the next stretch!`);
      });
    });
    listEl.querySelectorAll('[data-info-key]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const item = HIVE_SHOP_ITEMS.find(x=>x.key===btn.dataset.infoKey);
        showItemDetailPopup(item, i=>i.longDesc, item.icon(), '#8FA998');
      });
    });
    document.getElementById('hiveContinueBtn').addEventListener('click', ()=>{
      if(selectedItem){
        if(!state.hiveShopKeysUsed) state.hiveShopKeysUsed = [];
        if(!state.hiveShopKeysUsed.includes(selectedItem.key)) state.hiveShopKeysUsed.push(selectedItem.key);
        saveState(); checkAchievements();
      }
      runNextWave();
    });
    document.getElementById('hiveExitBtn').addEventListener('click', ()=>{
      showConfirm(`End this Hive run at ${kills} kills? Everything you've earned so far is already safely yours - this just ends your current streak.`, ()=> endHiveRun(true), {confirmLabel:'Yes, exit', hazard:true});
    });
  }

  function endHiveRun(voluntary){
    hiveRunActive = false;
    fighter.buffNextBattle = null;
    const restMs = kills*10000;
    fighter.tiredUntil = Date.now()+restMs; fighter.restTotalMs = restMs;
    state.stats.hiveBestKillCount = Math.max(state.stats.hiveBestKillCount||0, kills);
    saveState(); checkAchievements();
    const lootValue = Object.entries(lootCounts).reduce((sum,[k,v])=>{
      const item = k==='queensCrown' ? COSTUME_ITEMS.find(x=>x.key==='queensCrown') : POTION_ITEMS.find(x=>x.key===k);
      return sum + (item ? item.cost*v : 0);
    }, 0);
    container.innerHTML = `
      ${celebrationHTML(voluntary,'RUN COMPLETE!')}
      <div class="log-row"><div class="log-info"><div class="log-name">Monsters Defeated</div></div><div class="log-status" style="background:#a13a24;">${kills}</div></div>
      <div class="log-row"><div class="log-info"><div class="log-name">Total XP Earned</div></div><div class="log-status" style="background:#9B5DE5;">${totalXp}</div></div>
      <div class="log-row"><div class="log-info"><div class="log-name">Total Coins Earned</div></div><div class="log-status" style="background:#D4A017;">${formatCoins(totalCoins)}</div></div>
      <div class="log-row"><div class="log-info"><div class="log-name">Total Loot Value</div></div><div class="log-status" style="background:#3f6b4a;">${formatCoins(lootValue)}</div></div>
      <div class="hint" style="text-align:center;margin-top:8px;">${escapeHtml(fighter.name)} needs ${eggCountdownLabel(restMs)} to recover.</div>
      <div class="buttons-row"><button class="btn yolk small full" id="hiveBackBtn">Back to Arena</button></div>`;
    document.getElementById('hiveBackBtn').addEventListener('click', ()=>{ versusCategory='menu'; renderVersus(document.getElementById('panel')); });
  }

  runNextWave();
}
function runTapBattle(fighter, wild, targetEl, suffix, onComplete, skipTiredness, startingHp){
  const tired = isTired(fighter), penalty = tired?0.85:1;
  const fs = effectiveStats(fighter);
  const buff = fighter.buffNextBattle;
  if(buff && buff.power) fs.power = Math.round(fs.power*buff.power);
  if(buff && buff.guard) fs.guard = Math.round(fs.guard*buff.guard);
  if(buff && buff.hp) fs.hp = Math.round(fs.hp*buff.hp);
  if(buff && buff.powerAdd) fs.power += buff.powerAdd;
  if(buff && buff.guardAdd) fs.guard += buff.guardAdd;
  if(buff && buff.hpAdd) fs.hp += buff.hpAdd;
  const armor = fighter.armor ? ARMOR_ITEMS.find(a=>a.key===fighter.armor) : null;
  if(!skipTiredness){ markTired(fighter); fighter.buffNextBattle=null; }
  let fHp=(startingHp!=null) ? Math.min(startingHp, fs.hp) : fs.hp, wHp=wild.stats.hp;
  const maxFHp=fs.hp, maxWHp=wild.stats.hp;
  const log = [];
  let playerHitCount = 0, lastTapAt = 0, resolved = false, opponentTimer=null, safetyTimer=null, quickReflex=false, autoFighterTimer=null;
  const powerRatio = Math.min(1, Math.max(0, (fs.power - wild.stats.guard) / Math.max(1,wild.stats.guard)));

  const ids = { fBar:'fHpBar'+suffix, wBar:'wHpBar'+suffix, fPop:'fDmgPop'+suffix, wPop:'wDmgPop'+suffix, tapZone:'tapZone'+suffix, countdown:'tapCountdown'+suffix, timer:'battleTimer'+suffix, log: suffix?'arenaBattleLog':'battleLog', special:'special'+suffix, wFighter:'wFighter'+suffix };
  targetEl.innerHTML = `
    <div class="pixel sm" style="text-align:center; color:#666; margin-bottom:-4px;">Timer</div>
    <div id="${ids.timer}" style="color:var(--coral); font-family:'Baloo 2',sans-serif; font-weight:800; font-size:24px; text-align:center; width:100%;">20.00</div>
    ${specialBarHTML(ids.special)}
    <div class="battle-arena">
      <div class="battle-side"><div class="hp-bar-wrap"><div class="hp-bar-fill" id="${ids.fBar}"></div></div><div class="battle-fighter left float">${monsterSVG(fighter,80)}<div class="dmg-pop" id="${ids.fPop}"></div></div></div>
      <div class="tap-center" id="${ids.tapZone}"><div class="tap-countdown" id="${ids.countdown}"></div></div>
      <div class="battle-side"><div class="hp-bar-wrap"><div class="hp-bar-fill" id="${ids.wBar}"></div></div><div class="battle-fighter right float" id="${ids.wFighter}">${monsterSVG(wild,80)}<div class="dmg-pop" id="${ids.wPop}"></div></div></div>
    </div>
    ${suffix? '' : `<div class="pixel sm">${fighter.name} vs ${wild.name}</div>`}
    <div class="battle-log-label">Battle Log${isMaxHitActive()?' <span style="color:#E8542E;">- MAX HITS ACTIVE</span>':''}</div>
    <div class="battle-log" id="${ids.log}"></div>`;
  const fBar=document.getElementById(ids.fBar), wBar=document.getElementById(ids.wBar);
  const fPop=document.getElementById(ids.fPop), wPop=document.getElementById(ids.wPop);
  const logEl=document.getElementById(ids.log), countdownEl=document.getElementById(ids.countdown), tapZone=document.getElementById(ids.tapZone);
  const timerEl=document.getElementById(ids.timer);
  const specialCtrl = createSpecialAttackController(ids.special, tapZone, document.getElementById(ids.wFighter), ()=>{
    const specialDmg = fs.power+3;
    wHp -= specialDmg; popDmg(wPop, specialDmg); addLog(`${fighter.name} unleashes a special attack for ${specialDmg}!`); sfxCritical();
    updateBars();
    if(wHp<=0) finish(true);
  });
  let battleStartAt=0, timerInterval=null;

  function updateBars(){
    const fPct=Math.max(0,fHp)/maxFHp, wPct=Math.max(0,wHp)/maxWHp;
    fBar.style.width=(fPct*100)+'%'; fBar.style.background=hpBarColor(fPct);
    wBar.style.width=(wPct*100)+'%'; wBar.style.background=hpBarColor(wPct);
  }
  function popDmg(el, amount){ el.textContent='-'+amount; el.classList.remove('active'); void el.offsetWidth; el.classList.add('active'); }
  function addLog(text){ log.push(text); logEl.innerHTML += text+'<br>'; logEl.scrollTop=logEl.scrollHeight; }

  function finish(oneHitKO){
    if(resolved) return; resolved=true;
    clearInterval(opponentTimer); clearInterval(autoFighterTimer); clearTimeout(safetyTimer); clearInterval(timerInterval);
    tapZone.removeEventListener('click', onTap);
    tapZone.style.visibility='hidden';
    const won = fHp<=0 ? false : (wHp<=0 ? true : (fHp/maxFHp) >= (wHp/maxWHp)); // time-out edge case: whoever has more HP% left wins
    onComplete({ log, won, oneHitKO: !!oneHitKO, maxFHp, maxWHp, remainingFHp: Math.max(0,fHp) });
  }
  function opponentTick(){
    if(resolved) return;
    const dmg = Math.max(1, Math.round(wild.stats.power - fs.guard*penalty*0.4 + (Math.random()*6-3)));
    if(wild.isBoss && fighter.costume==='queensCrown' && Math.random()<0.2){
      wHp-=dmg; popDmg(wPop, dmg); sfxCritical(); updateBars();
      addLog(`${wild.name} is confused by her own Crown! The attack bounces back for ${dmg}!`);
      state.stats.queenConfusedCount = (state.stats.queenConfusedCount||0)+1;
      if(wHp<=0){ finish(false); return; }
      return; // the hit was reflected - the fighter takes nothing this turn
    }
    fHp -= dmg; popDmg(fPop, dmg); sfxHit(); updateBars();
    addLog(`${wild.name} hits ${fighter.name} for ${dmg}.`);
    if(armor && Math.random()<armor.recoil){
      const counter=Math.max(1,Math.round(dmg*0.4)); wHp-=counter; popDmg(wPop, counter); updateBars();
      addLog(`${fighter.name}'s armour counters for ${counter}!`);
      if(wHp<=0){ finish(false); return; }
    }
    if(buff && buff.reflect && Math.random()<buff.reflect.chance){
      const reflected=Math.max(1,Math.round(dmg*buff.reflect.mult)); wHp-=reflected; popDmg(wPop, reflected); updateBars();
      addLog(`${fighter.name} reflects ${reflected} damage back!`);
      if(wHp<=0){ finish(false); return; }
    }
    if(fHp<=0){ finish(false); return; }
  }
  function onTap(){
    if(resolved) return;
    const now = Date.now();
    if(now-lastTapAt < TAP_MIN_GAP_MS) return;
    if(playerHitCount===0 && battleStartAt && (now-battleStartAt)<400) quickReflex=true;
    lastTapAt = now;
    if(specialCtrl.consumeIfReady()) return;
    let dmg = Math.max(1, Math.round(fs.power*penalty*0.28 - wild.stats.guard*0.15 + (isMaxHitActive()?2:Math.random()*2)));
    const critChance = Math.min(0.4, 0.08 + powerRatio*0.2 + (quickReflex?0.12:0));
    const isCrit = isMaxHitActive() || Math.random() < critChance;
    if(isCrit) dmg = Math.round(dmg*1.8);
    const typeMult = typeMatchupMultiplier(fighter.type, wild.type);
    dmg = Math.round(dmg*typeMult);
    const burnDmg = weaponBurnDamage(fighter, wHp);
    wHp -= (dmg+burnDmg); playerHitCount++; popDmg(wPop, dmg+burnDmg); sfxHit(); if(isCrit) sfxCritical(); updateBars();
    specialCtrl.registerHit();
    if(isCrit) incrementQuestProgress('critHits');
    if(typeMult>1) incrementQuestProgress('superEffective');

function rateLimit(key, minGapMs){

function renderCollection(panel){
  if(state.collection.length===0){
    panel.innerHTML = `<div class="empty-state">SQUAD EMPTY<br><span style="font-weight:400;font-size:12px;">Scan something to catch your first Skrambeast.</span></div>`;

  }

  const sorted = [...filtered].sort((a,b)=>{
    const favDiff = (b.favorite?1:0)-(a.favorite?1:0); if(favDiff) return favDiff;
    if(a.favorite && b.favorite) return (a.favoritedAt||0)-(b.favoritedAt||0);
    const rarDiff = RARITY_ORDER.indexOf(b.rarity)-RARITY_ORDER.indexOf(a.rarity); if(rarDiff) return rarDiff;
    return b.level-a.level;
  });
  const totalPages = Math.max(1, Math.ceil(sorted.length/SQUAD_PAGE_SIZE));
  squadPage = Math.min(squadPage, totalPages-1);
  const pageItems = sorted.slice(squadPage*SQUAD_PAGE_SIZE, squadPage*SQUAD_PAGE_SIZE+SQUAD_PAGE_SIZE);
  const filterBtns = RARITY_ORDER.map(r=> `<button class="btn tiny ${squadFilter===r?'yolk':'cream'}" style="padding:3px 5px;font-size:9px;" data-sfilter="${r}">${SQUAD_FILTER_LABEL[r]}</button>`).join('') + `<button class="btn tiny ${squadFilter==='queen'?'yolk':'cream'}" style="padding:3px 5px;font-size:9px;" data-sfilter="queen">Queen</button>`;
  const cap = squadCapacity();
  const buyRow = squadFull() ? `<div class="buttons-row"><button class="btn yolk small full" id="buySquadPageBtn">Buy Squad Space - ${formatCoins(squadSpaceCost(squadPagesOwned()+1))} coins</button></div>` : '';
  panel.innerHTML = `
    <div class="buttons-row" style="margin-top:0;justify-content:flex-end;"><button class="btn tiny cream" id="squadAnalysisBtn" style="position:relative;display:flex;align-items:center;gap:4px;">${iconClipboard(14)} Analysis<span id="squadAnalysisBadge" class="tab-badge" style="display:none;"></span></button></div>
    <div class="buttons-row" style="margin-top:0;flex-wrap:wrap;justify-content:center;gap:3px;">${filterBtns}</div>
    ${buyRow}
    <div class="page-bar" style="margin-top:4px;"><button class="btn tiny cream" id="squadPrev" ${squadPage===0?'disabled':''}>${iconChevron('left')}</button><span class="pixel sm">${squadPage+1}/${totalPages}</span><button class="btn tiny cream" id="squadNext" ${squadPage>=totalPages-1?'disabled':''}>${iconChevron('right')}</button></div>
    <div class="tile-grid" id="squadGrid"></div>`;
  document.getElementById('squadAnalysisBtn').addEventListener('click', showSquadAnalysisPanel);
  const sqBadge = document.getElementById('squadAnalysisBadge');
  const sqIssueCount = computeSquadAnalysis().issues.length;
  if(sqIssueCount>0){ sqBadge.textContent = sqIssueCount; sqBadge.style.display = 'flex'; }
  panel.querySelectorAll('[data-sfilter]').forEach(b=> b.addEventListener('click', ()=>{ squadFilter = squadFilter===b.dataset.sfilter ? 'all' : b.dataset.sfilter; squadPage=0; renderCollection(panel); }));
  if(squadFull()) document.getElementById('buySquadPageBtn').addEventListener('click', ()=> buySquadPage(()=> renderCollection(panel)));
  renderSquadGrid(panel);
  document.getElementById('squadPrev').addEventListener('click', ()=>{ if(rateLimit('pageTurn',180)) return; if(squadPage===0) return; squadPage=Math.max(0,squadPage-1); renderCollection(panel); });
  document.getElementById('squadNext').addEventListener('click', ()=>{ if(rateLimit('pageTurn',180)) return; if(squadPage>=totalPages-1) return; squadPage=Math.min(totalPages-1,squadPage+1); renderCollection(panel); });
}
// Rebuilds only the tile grid (not the header/filters/page-bar) - used after a favorite
// toggle so the shimmer animation on holo tiles doesn't restart across the whole page.
function renderSquadGrid(panel){
  document.querySelectorAll('.modal-overlay').forEach(el=>{
    if(el._boostTimerInterval) clearInterval(el._boostTimerInterval);
    el.remove();
  });
  const filtered = squadFilter==='all' ? state.collection : squadFilter==='queen' ? state.collection.filter(m=>m.isBoss) : state.collection.filter(m=>m.rarity===squadFilter && !m.isBoss);
  const sorted = [...filtered].sort((a,b)=>{
    const favDiff = (b.favorite?1:0)-(a.favorite?1:0); if(favDiff) return favDiff;
    if(a.favorite && b.favorite) return (a.favoritedAt||0)-(b.favoritedAt||0);
    const rarDiff = RARITY_ORDER.indexOf(b.rarity)-RARITY_ORDER.indexOf(a.rarity); if(rarDiff) return rarDiff;
    return b.level-a.level;
  });
  const totalPages = Math.max(1, Math.ceil(sorted.length/SQUAD_PAGE_SIZE));
  if(squadPage > totalPages-1){ renderCollection(panel); return; } // page count changed (e.g. filter moved us out of range) - needs a full rebuild
  const pageItems = sorted.slice(squadPage*SQUAD_PAGE_SIZE, squadPage*SQUAD_PAGE_SIZE+SQUAD_PAGE_SIZE);
  const grid = document.getElementById('squadGrid');
  if(!grid) return;
  grid.innerHTML = '';
  pageItems.forEach(m=>{
    const rs = RARITY_STYLE[m.rarity];
    const tile = document.createElement('div');
    tile.className = 'tile'+(m.holo?' holo':'')+(isTired(m)?' resting':'')+(monsterOnMission(m)?' on-mission':'');
    tile.dataset.rarity = m.rarity;
    tile.style.setProperty('--rarity', rs.color);
    const boostBadgeStr = m.favorite ? ['xp','coin','capture'].map(kind=>{
      const b = state.activeBoosts && state.activeBoosts[kind];
      if(!b || Date.now()>=b.expiresAt) return '';
      const it = BOOST_ITEMS.find(x=>x.key===b.key);
      return it ? `<span class="tile-boost">${it.badge}</span>` : '';
    }).join('') : '';
    tile.innerHTML = `<button class="tile-star">${iconStar(m.favorite)}</button><div class="tile-lvl">${m.level}</div><div class="tile-icon">${monsterSVG(m,34)}</div>${boostBadgeStr?`<div class="tile-boosts">${boostBadgeStr}</div>`:''}${isMaxed(m)?(m.isBoss?`<div class="tile-trophy" style="background:#D4A017;">${iconCrown()}</div>`:`<div class="tile-trophy">${iconTrophy(12,rs.color)}</div>`):''}`;
    tile.querySelector('.tile-star').addEventListener('click', e=>{ e.stopPropagation(); toggleFavorite(m); renderSquadGrid(panel); });
    tile.addEventListener('click', ()=> openDetailModal(m, true));
    grid.appendChild(tile);
  });
  attachSwipe(grid, ()=>{ if(squadPage<totalPages-1){ squadPage++; renderCollection(panel);} }, ()=>{ if(squadPage>0){ squadPage--; renderCollection(panel);} });
}
function releaseMonster(id){
  const m = state.collection.find(x=>x.id===id);
  if(m && monsterOnMission(m)){ showToast("This Skrambeast is out on a mission - can't release it until it's back"); return; }
  state.collection = state.collection.filter(x=>x.id!==id);
  if(m){
    (m.equipped||[]).forEach(key=>{ state.inventory[key]=(state.inventory[key]||0)+1; });
    if(m.weapon) state.inventory[m.weapon]=(state.inventory[m.weapon]||0)+1;
    if(m.armor) state.inventory[m.armor]=(state.inventory[m.armor]||0)+1;
    if(m.costume) state.inventory[m.costume]=(state.inventory[m.costume]||0)+1;
    if(!state.discarded.includes(m.barcode)) state.discarded.push(m.barcode); logAlmanac(m,'shooed');
    if(isMaxed(m)){
      if(m.isBoss) state.stats.maxedQueensShooed = (state.stats.maxedQueensShooed||0)+1;
      else { if(!state.stats.maxedShooedByRarity) state.stats.maxedShooedByRarity={}; state.stats.maxedShooedByRarity[m.rarity] = (state.stats.maxedShooedByRarity[m.rarity]||0)+1; }
      checkAchievements();
    }
  }
  saveState(); sfxShoo();
  showToast("Released back into the wild - any gear it wore is back in your inventory");
  if(currentTab==='collection' && squadSubView==='squad'){ renderCollection(document.getElementById('panel')); }
}

/* ---- Detail modal ---- */
function closeDetailModal(overlay){
  if(overlay._boostTimerInterval) clearInterval(overlay._boostTimerInterval);
  document.querySelectorAll('.modal-overlay').forEach(el=>{
    if(el._boostTimerInterval) clearInterval(el._boostTimerInterval);
    el.remove();
  });
  document.body.style.overflow = '';
  void document.body.offsetHeight; // forces a clean repaint boundary before the next DOM rebuild - see comment on the reported static/interlace glitch
  const panel = document.getElementById('panel');
  if(currentTab==='collection' && squadSubView==='squad'){ renderCollection(panel); }
  else renderTab();
}

      <div class="modal-actions" id="modalActions"></div>

      const parts = ['xp','coin','capture'].map(kind=>{
        const b = state.activeBoosts && state.activeBoosts[kind];
        if(!b || Date.now()>=b.expiresAt) return '';
        const it = BOOST_ITEMS.find(x=>x.key===b.key);
        const remain = Math.ceil((b.expiresAt-Date.now())/1000);
        return `${it?it.badge:''} ${Math.floor(remain/60)}:${(remain%60).toString().padStart(2,'0')}`;
      }).filter(Boolean);
      boostTimerEl.textContent = parts.join(' ');
      if(!parts.length){ clearInterval(modalBoostTimer); modalBoostTimer=null; }
    };
    updateBoostTimer();
    modalBoostTimer = setInterval(updateBoostTimer, 1000);
    overlay._boostTimerInterval = modalBoostTimer;
  }
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeDetailModal(overlay); });
  document.getElementById('modalFavStar').addEventListener('click', ()=>{
    if(toggleFavorite(m)) document.getElementById('modalFavStar').innerHTML = iconStar(m.favorite);
  });
  if(editable){

        <div class="buttons-row" style="margin-top:10px;"><button class="btn yolk small full" id="monsterRenameSaveBtn">Save</button></div>
        <div class="buttons-row"><button class="btn cream small full" id="monsterRenameCancelBtn">Cancel</button></div>
      </div>`;
      document.body.appendChild(renameOverlay);
      const input = document.getElementById('monsterRenameInput');
      input.addEventListener('paste', e=> e.preventDefault());
      input.addEventListener('input', ()=>{ input.value = input.value.replace(/[^a-zA-Z0-9 ]/g,'').slice(0,15); });
      document.getElementById('monsterRenameCancelBtn').addEventListener('click', ()=> renameOverlay.remove());

        const nameDisplay = document.getElementById('modalNameDisplay');

    renderModalActions(document.getElementById('modalActions'), m, overlay, allowEquip);
  }

function legacyCopy(text){
  try{
    const prevSelection = document.getSelection().rangeCount>0 ? document.getSelection().getRangeAt(0) : null;
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='absolute'; ta.style.top='0'; ta.style.left='-9999px'; // off-screen, but still genuinely rendered - opacity:0 makes select() unreliable on mobile
    ta.style.fontSize='12pt'; // stops iOS auto-zooming into the field on focus
    ta.contentEditable='true'; // some Android versions ignore select() on a plain textarea unless it's also editable
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    ta.setSelectionRange(0, text.length); // iOS Safari specifically requires this in addition to select()
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    if(prevSelection){ const sel=document.getSelection(); sel.removeAllRanges(); sel.addRange(prevSelection); }
    return ok;
  }catch(e){ return false; }
}
// Anything read from shared storage (a friend's profile, a trade partner's offer) could have
// bypassed this client's own input filters entirely - escape before it ever reaches innerHTML.
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function copyText(text, okMsg, failMsg){
  const done = ()=> showToast(okMsg);
  const fail = ()=> showToast(failMsg || "Couldn't copy here - try again once this is open in a full browser tab");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=> legacyCopy(text)?done():fail());
  } else { legacyCopy(text)?done():fail(); }
}

// The ONE place identity is allowed to change. Every UI that lets a player set/change their
// username must call this - never assign state.hunterName directly anywhere else. This is what
// keeps the Firebase username index correct; a prior bug let both the onboarding screen and the
// Nearby pairing screen bypass this entirely, silently breaking uniqueness for those players.
async function changeUsername(rawDesired){
  const desired = String(rawDesired||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!desired || desired.length<3) return {ok:false, message:"Username needs at least 3 letters/numbers, no spaces or symbols"};
  if(desired.length>15) return {ok:false, message:"Username needs to be 15 characters or fewer"};
  if(desired===state.hunterName) return {ok:false, message:"That's already your username!"};
  if(isProfane(desired)) return {ok:false, message:"Please choose a different username"};
  try{
    const existingId = await resolveUsernameToPlayerId(desired);
    if(existingId && existingId!==state.playerId) return {ok:false, message:"This hunter name is taken - try another"};
  }catch(e){ /* not found is expected and means it's available */ }
  state.hunterName = desired;
  saveState();
  await publishHunterProfile();
  return {ok:true, message:`Username set to ${desired}!`};
}
// A permanent internal identity, separate from the player's chosen username - this never changes,
// so friend connections survive username changes instead of breaking (the old hunter:<username> key
// scheme meant a rename silently orphaned anyone who'd already added the old name).
function ensurePlayerId(){
  if(!state.playerId){
    state.playerId = (typeof crypto!=='undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'p-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
    saveState();
  }
  return state.playerId;
}

async function checkFriendAcceptedMarkers(){
  const myId = ensurePlayerId();
  let entries = []; // each: {accepterId, val}
  if(HAS_CLAUDE_STORAGE){
    try{
      const res = await window.storage.list(`friendAcceptedBy:${myId}:`, true);
      if(res && res.keys){
        const fetched = await Promise.all(res.keys.map(async k=>{
          try{ const r = await window.storage.get(k, true); return r ? {accepterId:k.split(':')[2], key:k, val:JSON.parse(r.value)} : null; }catch(e){ return null; }
        }));
        entries = fetched.filter(Boolean);
      }
    }catch(e){}
  } else if(HAS_FIREBASE){
    try{
      const res = await fetch(`${FIREBASE_DB_URL}/shared/friendAcceptedBy/${firebaseSafeKey(myId)}.json`);
      if(res.ok){
        const data = await res.json();
        if(data) entries = Object.keys(data).map(k=>({accepterId:k, val:data[k]}));
      }
    }catch(e){}
  }
  if(entries.length===0) return false;
  let anyUpgraded = false;
  if(!state.friends) state.friends=[];
  for(const entry of entries){
    const existing = state.friends.find(f=>f.playerId===entry.accepterId);
    if(existing){ if(existing.status==='pending'){ existing.status='accepted'; anyUpgraded=true; } }
    else { state.friends.push({playerId:entry.accepterId, status:'accepted'}); anyUpgraded=true; }
    if(HAS_CLAUDE_STORAGE){ try{ await window.storage.delete(entry.key, true); }catch(e){} }
    else if(HAS_FIREBASE){ try{ await fetch(`${FIREBASE_DB_URL}/shared/friendAcceptedBy/${firebaseSafeKey(myId)}/${firebaseSafeKey(entry.accepterId)}.json${state.authIdToken?"?auth="+state.authIdToken:""}`, {method:'DELETE'}); }catch(e){} }
  }
  if(anyUpgraded){ saveState(); checkAchievements(); }
  return anyUpgraded;
}
// Resolves a typed username to the stable player ID behind it, via the username:<name> index -
// returns null if nobody has published under that username. The username is now just hunterName
// itself (the old separate, auto-generated hunterCode has been retired) - what's shown on the
// leaderboard is exactly what resolves here, no hidden second identifier involved.
async function resolveUsernameToPlayerId(username){
  try{
    const res = await storageGet('username:'+username, true);
    if(res && res.value){ const parsed = JSON.parse(res.value); return parsed.playerId||null; }
  }catch(e){}
  return null;
}
function myPublicProfile(){
  const highest = [...state.collection].sort((a,b)=>b.level-a.level)[0];
  const now = Date.now();
  const DAY_MS = 86400000, WEEK_MS = 7*DAY_MS;
  if(!state.dailyXpBaseline || now - state.dailyXpBaseline.start >= DAY_MS){
    state.dailyXpBaseline = { start: now, xp: state.hunterXP||0 };
  }
  if(!state.weeklyXpBaseline || now - state.weeklyXpBaseline.start >= WEEK_MS){
    state.weeklyXpBaseline = { start: now, xp: state.hunterXP||0 };
  }
  const snap = m=> ({barcode:m.barcode, name:m.name, type:m.type, typeLabel:m.typeLabel, typeColor:m.typeColor, typeDark:m.typeDark, rarity:m.rarity, holo:m.holo, hueShift:m.hueShift, level:m.level, bio:m.bio, traits:Object.assign({},m.traits), stats:Object.assign({},m.stats), weapon:m.weapon||null, armor:m.armor||null, shield:m.shield||null, costume:m.costume||null, isBoss:m.isBoss||false});
  return {
    name: state.hunterName||'Hunter',
    totalWins: state.stats.totalWins, totalFights: state.stats.totalFights, bestStreak: state.stats.bestStreak,
    discovered: Object.keys(state.almanac).length,
    highest: highest? snap(highest) : null,
    squad: favoritedSquad().slice(0,5).map(snap),
    hunterXP: state.hunterXP||0,
    dailyXP: Math.max(0, (state.hunterXP||0) - state.dailyXpBaseline.xp),
    weeklyXP: Math.max(0, (state.hunterXP||0) - state.weeklyXpBaseline.xp),
    maxedCount: RARITY_ORDER.reduce((sum,r)=> sum+((state.stats.lifetimeMaxedByRarity&&state.stats.lifetimeMaxedByRarity[r])||0), 0) + (state.stats.lifetimeMaxedQueens||0),
    maxedByRarity: RARITY_ORDER.reduce((acc,r)=>{ acc[r] = (state.stats.lifetimeMaxedByRarity&&state.stats.lifetimeMaxedByRarity[r])||0; return acc; }, {}),
    maxedQueens: state.stats.lifetimeMaxedQueens||0,
    skramTags: state.skramTags||{common:0,uncommon:0,rare:0,epic:0,legendary:0},
    lastSeen: now
  };
}
async function publishHunterProfile(){
  if(!state.hunterName) return; // hasn't set a name yet (shouldn't happen post-onboarding, but nothing to publish under if so)
  const playerId = ensurePlayerId();
  const name = state.hunterName;
  const profile = myPublicProfile();
  saveState(); // myPublicProfile may have just rolled the daily/weekly XP baseline forward - persist that
  try{ await storageSet('hunter:'+playerId, JSON.stringify(profile), true); }catch(e){}
  if(state.lastPublishedUsername !== name){
    try{
      const existingId = await resolveUsernameToPlayerId(name);
      if(existingId && existingId!==playerId){
        // a genuine collision from before uniqueness was enforced everywhere - don't steal their claim
        state.needsRename = true; saveState();
        return;
      }
    }catch(e){}
    state.needsRename = false;
    if(state.lastPublishedUsername){
      try{ await storageDelete('username:'+state.lastPublishedUsername, true); }catch(e){ /* best-effort - a stale index entry just means that old name won't resolve, no data loss */ }
    }
    try{
      await storageSet('username:'+name, JSON.stringify({playerId}), true);
      state.lastPublishedUsername = name;
      saveState();
    }catch(e){}
  }
}

function showBattleRequestWaiting(targetPlayerId, targetName){
  const overlay = document.createElement('div'); overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal-box" style="text-align:center;">
    <div class="pixel sm">Sending battle request to ${escapeHtml(targetName)}...</div>
    <div class="hint" id="fsWaitStatus" style="margin-top:8px;">Waiting for them to accept...</div>
    <div class="buttons-row"><button class="btn cream small full" id="fsWaitCancel">Cancel</button></div>
  </div>`;
  document.body.appendChild(overlay);
  let cancelled = false;
  let pollTimer = null;
  document.getElementById('fsWaitCancel').addEventListener('click', async ()=>{
    cancelled = true;
    clearInterval(pollTimer);
    try{ await storageDelete('battleRequest:'+targetPlayerId, true); }catch(e){}
    overlay.remove();
  });
  (async ()=>{
    const sessionCode = await sendBattleRequest(targetPlayerId, targetName);
    if(!sessionCode || cancelled){ if(!cancelled){ showToast("Couldn't send that request - try again"); overlay.remove(); } return; }
    pollTimer = setInterval(async ()=>{
      if(cancelled){ clearInterval(pollTimer); return; }
      try{
        const res = await storageGet('battleRequest:'+targetPlayerId, true);
        if(!res || !res.value){ clearInterval(pollTimer); if(!cancelled){ showToast(`${targetName} declined`); overlay.remove(); } return; }
        const req = JSON.parse(res.value);
        if(req.accepted){
          clearInterval(pollTimer);
          overlay.remove();
          enterBattleSession(sessionCode, document.getElementById('panel'));
        }
      }catch(e){}
    }, 2000);
  })();
}
