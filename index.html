      row.innerHTML = `<div class="sinfo"><div class="sdesc" style="font-size:11px;${alreadyCracked?'color:#fff;':'color:#333;'}">${item.text}</div></div>${isEgg3Target&&!alreadyCracked?'<div class="secret-crack-overlay" id="secretCrackOverlay"></div>':''}`;
      if(isEgg3Target && !alreadyCracked){
        let holdTimer = null, holdStart = 0, revealedCount = 0;
        const HOLD_MS = 2500;
        const CRACK_TOTAL = 14;
        const overlay = row.querySelector('#secretCrackOverlay');
        if(overlay){
          const marks = Array.from({length:CRACK_TOTAL}, ()=>{
            const left = (4+Math.random()*88).toFixed(1), top = (15+Math.random()*70).toFixed(1), len = Math.round(8+Math.random()*16), rot = Math.round(Math.random()*360);
            return `<div class="crack-mark" style="left:${left}%;top:${top}%;width:${len}px;transform:rotate(${rot}deg);"></div>`;
          }).join('');
          overlay.innerHTML = marks;
        }
        const markEls = overlay ? Array.from(overlay.querySelectorAll('.crack-mark')) : [];
        const cancelHold = ()=>{
          clearInterval(holdTimer); holdTimer=null; revealedCount=0;
          markEls.forEach(el=> el.classList.remove('visible'));
        };
        const startHold = ()=>{
          if(holdTimer) return;
          holdStart = Date.now();
          holdTimer = setInterval(()=>{
            const elapsed = Date.now()-holdStart;
            const pct = Math.min(1, elapsed/HOLD_MS);
            const targetCount = Math.floor(pct*CRACK_TOTAL);
            while(revealedCount<targetCount){ if(markEls[revealedCount]) markEls[revealedCount].classList.add('visible'); revealedCount++; }
            if(pct>=1){
              clearInterval(holdTimer); holdTimer=null;
              row.style.background='#1A1F1C'; row.style.borderColor='#000';
              row.innerHTML = `<div class="sinfo"><div class="sdesc" style="font-size:11px;color:#fff;">${item.text}</div></div>`;
              markEasterEggStep('egg3','b');
            }
          }, 60);
        };
        row.addEventListener('mousedown', startHold);
        row.addEventListener('touchstart', startHold);
        row.addEventListener('mouseup', cancelHold);
        row.addEventListener('mouseleave', cancelHold);
        row.addEventListener('touchend', cancelHold);
        row.addEventListener('touchcancel', cancelHold);
      }
    } else {
      row.style.background='#1a1f1c'; row.style.borderColor='#000'; row.style.cursor='pointer';
      row.innerHTML = `<div class="cat-badge" style="background:#000;">${iconLock()}</div><div class="sinfo"><div class="sname" style="color:#D4A017;letter-spacing:2px;">??????</div><div class="sdesc" style="color:#8a8f86;">Unlock for ${formatCoins(SECRET_COST)} coins</div></div>`;
      row.addEventListener('click', ()=>{
        if(state.coins < SECRET_COST){ showToast(`Need ${formatCoins(SECRET_COST)} coins to unlock this secret`); return; }
        showConfirm(`Unlock this Game Secret for ${formatCoins(SECRET_COST)} coins?`, ()=>{
          state.coins -= SECRET_COST; state.secretsPurchased.push(item.idx); saveState(); sfxCoin(); refreshCoinBadges();
          renderTips(container);
        });
      });
    }
    listEl.appendChild(row);
  });
  if(totalPages>1){
    document.getElementById('secretsPageBar').innerHTML = `<button class="btn tiny cream" id="secretsPrev" ${secretsPage===0?'disabled':''}>${iconChevron('left')}</button><span class="pixel sm">${secretsPage+1}/${totalPages}</span><button class="btn tiny cream" id="secretsNext" ${secretsPage>=totalPages-1?'disabled':''}>${iconChevron('right')}</button>`;
    document.getElementById('secretsPrev').addEventListener('click', ()=>{ if(secretsPage===0) return; secretsPage=Math.max(0,secretsPage-1); renderTips(container); });
    document.getElementById('secretsNext').addEventListener('click', ()=>{ if(secretsPage>=totalPages-1) return; secretsPage=Math.min(totalPages-1,secretsPage+1); renderTips(container); });

}

function formatPlayTime(ms){
  const totalMin = Math.floor(ms/60000);
  if(totalMin<60) return `${totalMin}m`;
  const totalHr = Math.floor(totalMin/60);
  if(totalHr<24) return `${totalHr}h ${totalMin%60}m`;
  const days = Math.floor(totalHr/24);
  return `${days}d ${totalHr%24}h`;
}

const STAT_EXPLAINER = {power:'Power drives how much damage you land per hit.', guard:'Guard reduces how much damage you take per hit.', speed:'Speed nudges your odds in speed-sensitive moments like critical hits.', hp:'HP is your total health pool for the fight.'};
const POTION_EFFECT_EXPLAINER = {
  heal: 'Fully clears fatigue on the monster it\'s used on - no waiting for rest.',
  buffPower: 'Applies only to the very next battle that monster fights, then it\'s used up.',
  buffGuard: 'Applies only to the very next battle that monster fights, then it\'s used up.',
  buffHp: 'Applies only to the very next battle that monster fights, then it\'s used up.',

};
function richItemDetail(it){
  const lines = [];
  if(it.stat && it.stat==='all' && it.bonus){
    lines.push(`Adds +${it.bonus} to every stat at once - Power, Guard, Speed, and HP.`);
  } else if(it.stat && it.stat==='rest' && it.bonus){
    lines.push(`Cuts that monster's rest time in half every time they need to recover.`);
  } else if(it.stat && it.bonus && STAT_EXPLAINER[it.stat]){
    lines.push(STAT_EXPLAINER[it.stat]);
  }
  if(it.alsoRest) lines.push(`Also halves rest time, on top of the stat bonus above.`);
  if(it.recoil) lines.push(`Roughly a ${Math.round(it.recoil*100)}% chance per hit you take to counter-attack back for 40% of the damage you received.`);
  if(it.effect && POTION_EFFECT_EXPLAINER[it.effect]) lines.push(POTION_EFFECT_EXPLAINER[it.effect]);
  if(it.durationMs) lines.push(`Lasts ${Math.round(it.durationMs/60000)} minutes once activated.`);
  if(it.guaranteed) lines.push(`Always succeeds - no chance involved.`);
  if(it.burn) lines.push(`Also burns for an extra ${Math.round(it.burn[0]*100)}-${Math.round(it.burn[1]*100)}% of the opponent's current HP on every hit.`);
  if(it.key && UPGRADE_ITEMS.some(u=>u.key===it.key)) lines.push(`Charms share ${MAX_EQUIP_SLOTS} equip slots per monster alongside any others you've equipped.`);
  if(it.specialist) lines.push(`One of the rarest, most powerful items in the game.`);
  return lines.join(' ');
}

          state.eggs.push({ barcode, rarity, readyAt: Date.now()+EGG_WAIT_MS[rarity] });
          saveState(); sfxCoin();
          showToast(`Mystery Egg added! Check the bottom of the Scan tab.`);
          renderBoosts(container, panel);
          return;
        }
        state.coins -= it.cost; refreshCoinBadges();
        if(!state.activeBoosts) state.activeBoosts={};
        state.activeBoosts[it.kind] = { key: it.key, mult: it.mult, expiresAt: Date.now()+it.durationMs };
        saveState(); sfxCoin();
        showToast(`${it.name} activated!`);
        renderBoosts(container, panel);
      });
    }
    list.appendChild(row);
  });
  clearInterval(boostsTickTimer);
  boostsTickTimer = setInterval(()=>{
    if(currentTab!=='store' || storeCategory!=='boosts'){ clearInterval(boostsTickTimer); return; }
    let anyExpired = false;
    document.querySelectorAll('[data-boost-timer]').forEach(el=>{
      const kind = el.dataset.boostTimer;
      const b = state.activeBoosts && state.activeBoosts[kind];
      if(!b || Date.now()>=b.expiresAt){ anyExpired = true; return; }
      const remain = Math.ceil((b.expiresAt-Date.now())/1000);
      el.textContent = `${Math.floor(remain/60)}:${(remain%60).toString().padStart(2,'0')}`;
    });
    if(anyExpired) renderBoosts(container, panel);
  }, 1000);
}

function startNearbyDuelBattle(myTeam, opponentTeam, container, onFinish){
  let myIdx=0, oppIdx=0;
  const myFainted = myTeam.map(()=>false);
  const oppFainted = opponentTeam.map(()=>false);
  const myFighterHp = m=> effectiveStatsWithBuff(m).hp;
  const oppFighterHp = m=> effectiveStats(m).hp;
  let myHp = myFighterHp(myTeam[0]);
  let oppHp = oppFighterHp(opponentTeam[0]);
  let defeatedCount = 0;
  let resolved=false, lastTapAt=0, opponentTimer=null, lastHiddenAt=0, autoFighterTimer=null;

  container.innerHTML = `
    <div style="text-align:center;width:100%;">
      <div class="pixel sm" style="color:#a13a24;" id="ndOppName">${opponentTeam[0].name}</div>
      <div class="hp-bar-wrap" style="width:140px;margin:4px auto;"><div class="hp-bar-fill" id="ndHpBar"></div></div>
      <div class="float" style="width:90px;height:90px;margin:4px auto;" id="ndOppSvg">${monsterSVG(opponentTeam[0],90)}</div>
    </div>
    <div class="tap-center" id="ndTapZone" style="margin:8px auto;"><div class="tap-countdown" id="ndCountdown"></div></div>
    <div class="arena-roster" id="ndRoster"></div>
    <div class="arena-roster" id="ndOppRoster" style="opacity:.7;"></div>
    <div class="battle-log-label">Battle Log${isMaxHitActive()?' <span style="color:#E8542E;">- MAX HITS ACTIVE</span>':''}</div>
    <div class="battle-log" id="ndBattleLog"></div>`;
  const oppBar=document.getElementById('ndHpBar');
  const logEl=document.getElementById('ndBattleLog'), countdownEl=document.getElementById('ndCountdown'), tapZone=document.getElementById('ndTapZone');
  const rosterEl=document.getElementById('ndRoster'), oppRosterEl=document.getElementById('ndOppRoster');
  const oppNameEl=document.getElementById('ndOppName'), oppSvgEl=document.getElementById('ndOppSvg');
  const logLines = [];

  function renderRosters(){
    rosterEl.innerHTML = myTeam.map((m,i)=> `<div class="arena-roster-icon${i===myIdx?' selected':''}" style="${myFainted[i]?'opacity:.3;':''}"><div style="width:26px;height:26px;">${monsterSVG(m,26)}</div><span class="pixel sm">Lv.${m.level}</span></div>`).join('');
    oppRosterEl.innerHTML = opponentTeam.map((m,i)=> `<div class="arena-roster-icon${i===oppIdx?' selected':''}" style="${oppFainted[i]?'opacity:.3;':''}"><div style="width:26px;height:26px;">${monsterSVG(m,26)}</div><span class="pixel sm">Lv.${m.level}</span></div>`).join('');
  }
  function updateBars(){ const pct=Math.max(0,oppHp)/oppFighterHp(opponentTeam[oppIdx]); oppBar.style.width=(pct*100)+'%'; oppBar.style.background=hpBarColor(pct); }
  function addLog(text){ logLines.push(text); logEl.innerHTML += text+'<br>'; logEl.scrollTop=logEl.scrollHeight; }

  function advanceMyFighter(){
    myFainted[myIdx]=true;
    addLog(`${myTeam[myIdx].name} has fainted!`);
    const nextIdx = myFainted.findIndex(f=>!f);
    if(nextIdx===-1){ finish(false); return; }
    myIdx=nextIdx; myHp=myFighterHp(myTeam[myIdx]);
    renderRosters();
    addLog(`${myTeam[myIdx].name} steps up!`);
  }
  function advanceOppFighter(){
    oppFainted[oppIdx]=true;
    defeatedCount++;
    addLog(`${opponentTeam[oppIdx].name} has fainted!`);
    const nextIdx = oppFainted.findIndex(f=>!f);
    if(nextIdx===-1){ finish(true); return; }
    oppIdx=nextIdx; oppHp=oppFighterHp(opponentTeam[oppIdx]);
    oppNameEl.textContent = opponentTeam[oppIdx].name;
    oppSvgEl.innerHTML = monsterSVG(opponentTeam[oppIdx],90);
    renderRosters(); updateBars();
    addLog(`${opponentTeam[oppIdx].name} steps up!`);
  }
  function finish(iWon){
    if(resolved) return; resolved=true;
    clearInterval(opponentTimer); clearInterval(autoFighterTimer);
    document.removeEventListener('visibilitychange', onVisibilityChange);
    tapZone.removeEventListener('click', onTap);
    tapZone.style.visibility='hidden';
    myTeam.forEach(m=> m.buffNextBattle=null);
    const survivingHp = iWon ? myTeam.reduce((sum,m,i)=> sum + (i===myIdx? Math.max(0,myHp) : (myFainted[i]?0:myFighterHp(m))), 0) : 0;
    onFinish({ won:iWon, defeatedCount, survivingHp, log:logLines });
  }
  function opponentTick(){
    if(resolved) return;
    const fighter=myTeam[myIdx], fs=effectiveStatsWithBuff(fighter);
    const oppFighter=opponentTeam[oppIdx], oppStats=effectiveStats(oppFighter);
    const armor = fighter.armor? ARMOR_ITEMS.find(a=>a.key===fighter.armor):null;
    const dmg = Math.max(1, Math.round(oppStats.power - fs.guard*0.35 + (Math.random()*8-4)));
    myHp -= dmg; sfxHit();
    addLog(`${oppFighter.name} hits ${fighter.name} for ${dmg}.`);
    if(armor && Math.random()<armor.recoil){ const counter=Math.max(1,Math.round(dmg*0.4)); oppHp-=counter; addLog(`${fighter.name}'s armour counters for ${counter}!`); updateBars(); }
    if(oppHp<=0){ advanceOppFighter(); return; }
    if(myHp<=0) advanceMyFighter();
  }
  function onTap(){
    if(resolved) return;
    const now=Date.now(); if(now-lastTapAt<TAP_MIN_GAP_MS) return; lastTapAt=now;
    const fighter=myTeam[myIdx], oppFighter=opponentTeam[oppIdx];
    const fs=effectiveStatsWithBuff(fighter);
    let dmg = Math.max(1, Math.round(fs.power*0.28 - effectiveStats(oppFighter).guard*0.12 + (isMaxHitActive()?2:Math.random()*2)));
    const typeMult = typeMatchupMultiplier(fighter.type, oppFighter.type);
    dmg = Math.round(dmg*typeMult);
    const burnDmg = weaponBurnDamage(fighter, oppHp);
    oppHp -= (dmg+burnDmg); sfxHit();
    addLog(`${fighter.name} hits ${oppFighter.name} for ${dmg}.${typeMult>1?' Super effective!':typeMult<1?' Not very effective.':''}${burnDmg>0?` Burns for ${burnDmg} more!`:''}`);
    tapZone.classList.remove('tap-pulse'); void tapZone.offsetWidth; tapZone.classList.add('tap-pulse');
    if(oppHp<=0){ advanceOppFighter(); return; }
    updateBars();
  }
  function onVisibilityChange(){
    if(document.hidden){ lastHiddenAt=Date.now(); }
    else if(lastHiddenAt && !resolved){
      const interval = 2500;
      const ticks = Math.floor((Date.now()-lastHiddenAt)/interval);
      if(ticks>0){ addLog(`(While away, they landed ${ticks} hit${ticks>1?'s':''}.)`); for(let i=0;i<ticks && !resolved;i++) opponentTick(); }
      lastHiddenAt=0;
    }
  }
  renderRosters(); updateBars();
  document.addEventListener('visibilitychange', onVisibilityChange);
  battleCountdownActive = true;
  const steps=['3','2','1','TAP!']; let si=0;
  const showStep=()=>{
    if(si>=steps.length){
      countdownEl.textContent='';
      battleCountdownActive = false;
      tapZone.addEventListener('click', onTap);
      autoFighterTimer = maybeStartAutoFighter(onTap);
      opponentTimer = setInterval(opponentTick, 2500);
      return;
    }
    countdownEl.textContent=steps[si];
    countdownEl.classList.remove('cd-pop'); void countdownEl.offsetWidth; countdownEl.classList.add('cd-pop');
    si++; setTimeout(showStep,750);
  };
  showStep();
}
function startBossTrainingBattle(boss, container){

  if(team.length<5){ showToast("You need 5 favourites to train against a Queen"); return; }

function resolveBossTraining(boss, team, won, container){

    state.stats.bossTrainingWins = (state.stats.bossTrainingWins||0)+1;
    const xpEach = Math.round(xpReward(boss.level, boss.rarity)*5); // 5x normal Arena XP per fighter, since training uses your whole 5-monster squad at once - coins/loot stay far below the real boss fight (1x coin value here vs 40x there, no loot here at all)
    team.forEach(m=> grantXP(m, xpEach));

    container.appendChild(banner);
    const note=document.createElement('div'); note.className='hint'; note.style.textAlign='center';

          rosterEl.innerHTML = team.map(m=> `<div class="arena-roster-icon"><div style="width:26px;height:26px;">${monsterSVG(m,26)}</div><span class="pixel sm">Lv.${m.level}</span></div>`).join('');

function activeBoostTimersHTML(){

      const timeStr = `${Math.floor(remain/60).toString().padStart(2,'0')}:${(remain%60).toString().padStart(2,'0')}`;

function trackEasterEgg2ArenaTap(favs, m){
  if(favs.length<5) return;
  if(!state.easterEgg2ArenaProgress) state.easterEgg2ArenaProgress={nextIndex:0, bigPreviewDone:false};
  const prog = state.easterEgg2ArenaProgress;
  if(prog.nextIndex>=5) return; // roster portion already complete this run - further taps don't disturb it
  const idx = favs.findIndex(x=>x.id===m.id);
  if(idx===prog.nextIndex){ prog.nextIndex++; }
  else { prog.nextIndex = (idx===0)?1:0; prog.bigPreviewDone=false; }
  saveState();
}
function renderArenaRoster(container, outerContainer){
  const favs = favoritedSquad();
  container.innerHTML = favs.map(m=>{
    const tired = isTired(m);
    return `<div class="arena-roster-icon${selectedArenaFighterId===m.id?' selected':''}${tired?' tired':''}" data-fighter-id="${m.id}">

    if(!m || isTired(m)) return;

      const now = Date.now();
      const isDoubleTap = lastTapId===m.id && (now-lastTapTime)<350;
      lastTapTime = now; lastTapId = m.id;

    });
  });

function ensureArenaOpponent(){
  if(!arenaOpponent || arenaOpponentResolved){
    const fakeBarcode = 'arena-'+Date.now()+'-'+Math.floor(Math.random()*100000);
    const favs = favoritedSquad();
    const avgLevel = favs.length ? Math.round(favs.reduce((s,m)=>s+m.level,0)/favs.length) : 1;
    arenaOpponent = generateMonster(fakeBarcode, null, avgLevel, true);
    const qMult = queenSquadMultiplier(favs);
    if(qMult>1){
      arenaOpponent.stats.power = Math.round(arenaOpponent.stats.power*qMult);
      arenaOpponent.stats.guard = Math.round(arenaOpponent.stats.guard*qMult);
      arenaOpponent.stats.hp = Math.round(arenaOpponent.stats.hp*qMult);
    }
    arenaOpponentResolved = false;
    logAlmanac(arenaOpponent, 'seen');

}

function runArenaBattle(container){
  const fighter = state.collection.find(m=>m.id===selectedArenaFighterId);

  if(isTired(fighter)){ showToast(`${fighter.name} needs to rest - pick another favourite`); return; }
  const bt = document.getElementById('arenaBoostTimers'); if(bt) bt.innerHTML = activeBoostTimersHTML();
  const wild = arenaOpponent;
  arenaOpponentResolved = true;
  runTapBattle(fighter, wild, container, 'A', (result)=>{
    trackBattleResult(result.won, wild);
    if(result.won) incrementQuestProgress('arenaWins');
    const koBonus = result.oneHitKO ? 1.5 : 1;
    const winXp = Math.round(xpReward(wild.level, wild.rarity)*koBonus);
    const lossXp = Math.max(1, Math.round(wild.stats.hp * 0.10));
    let leveled=false, leveledDown=false, lootLabel=null, coinAmount=0, xpRedirectLabel=null, coinsFromXpConvert=0;
    if(result.won){
      if(wild.carriedItem){
        const carried = wild.carriedItem;
        if(carried.kind==='coins') addCoins(carried.amount); else state.inventory[carried.key]=(state.inventory[carried.key]||0)+1;
        lootLabel = carriedItemLabel(carried);
      }
      const winXpFinal = Math.round(winXp*(lootLabel?1.15:1));
      if(isMaxed(fighter) && favoritedSquad().every(isMaxed)){
        // Mirrors grantXP's own redirect conditions exactly, purely for display - grantXP below
        // still does the actual granting/converting, this just predicts which note to show.
        const boostedXp = Math.max(0, Math.round(winXpFinal*activeBoostMult('xp')));
        if(hunterRankIndex(state.hunterXP||0) >= HUNTER_RANKS.length-1) coinsFromXpConvert = Math.round(boostedXp/2);
        else xpRedirectLabel = `+${boostedXp} Rank XP`;
      }
      leveled = grantXP(fighter, winXpFinal);
      coinAmount = Math.round(arenaCoinReward(wild.level, wild.rarity)*0.6*koBonus);
      addCoins(coinAmount);
    }
    else {
      leveledDown = loseXP(fighter, lossXp);
      coinAmount = Math.max(1, Math.round(arenaCoinReward(wild.level, wild.rarity)*0.15)); // small consolation payout - every match should feel worth playing
      addCoins(coinAmount);
    }
    if(result.oneHitKO){ state.stats.oneHitKOs=(state.stats.oneHitKOs||0)+1; showToast("ONE-HIT KO! Bonus XP and coins"); }
    logAlmanac(wild, 'battled');
    saveState();
    const displayXp = result.won ? Math.round(winXp*(lootLabel?1.15:1)) : lossXp;
    finishArenaBattle(fighter, wild, result.won, leveled, leveledDown, displayXp, coinAmount, lootLabel, result.oneHitKO, container, xpRedirectLabel, coinsFromXpConvert);
  });
}

  extra.innerHTML = celebrationHTML(won, battleTitle(won, oneHitKO, leveled, fighter.level)) + xpNote + coinNote + lootNote + fleeNote;

  row.appendChild(mkBtn('yolk small full','Continue to Next Opponent', ()=>{

    renderArena(container);
  }));

}

/* ---- NEARBY: unified shared code, trade + team battle ---- */
let nearbyCode=null, nearbyRole=null, nearbyDoc=null, nearbyPollTimer=null, nearbySubMode='trade', nearbyMyOwnCode=null;
let nearbyMyBattleTeam=[], nearbyAppliedLocally=false;
function stopNearbyPoll(){ if(nearbyPollTimer){ clearInterval(nearbyPollTimer); nearbyPollTimer=null; } }
function randomCode(){ return String(Math.floor(1000+Math.random()*9000)); }
async function fetchNearbyDoc(code){ try{ const res=await storageGet('nearby:'+code, true); return res&&res.value? JSON.parse(res.value):null; }catch(e){ return null; } }
let nearbySaveInFlight = false;
async function saveNearbyDocRaw(code, doc){
  nearbySaveInFlight = true;
  try{ await storageSet('nearby:'+code, JSON.stringify(doc), true); }catch(e){ console.warn('nearby save failed', e); }
  nearbySaveInFlight = false;
}
async function deleteNearbyDoc(code){ try{ await storageDelete('nearby:'+code, true); }catch(e){} }
function blankTradeSide(){ return {offerMonster:null, offerCoins:0, offerItemKey:null, offerItemQty:0, accepted:false, applied:false}; }
function blankBattleSide(){ return {team:[], ready:false, myResult:null}; }
function mySide(doc,kind){ return nearbyRole==='host'? doc[kind].host : doc[kind].guest; }
function theirSide(doc,kind){ return nearbyRole==='host'? doc[kind].guest : doc[kind].host; }

function renderNearby(panel){
  if(!nearbyDoc){
    const localWarning = !HAS_SHARED_BACKEND ? `<div class="hint" style="color:#a13a24;margin:8px 0;">No shared server is set up yet, so pairing can't bridge two different phones on this build. Guest (same-device) and Arena still work fully.</div>` : '';
    // This screen runs over the shared-code backend above (Firebase/Claude storage) -
    // an honest match for its "Player VS Player" name now, not a claim of real Bluetooth.
    // Needs FIREBASE_DB_URL configured (see ANDROID CONVERSION REQUIREMENT near the top
    // of the script) to actually bridge two different Android devices.
    if(!nearbyMyOwnCode){ nearbyMyOwnCode = randomCode(); connectNearby(nearbyMyOwnCode, panel); return; }
    panel.innerHTML = `
      <div class="hint">Your pairing code - share it with anyone, anywhere, to trade or battle. Great for meeting new hunters who aren't on your Friends list yet:</div>
      <div class="coin-offer-display" style="font-size:20px;">${nearbyMyOwnCode}</div>
      <div class="hint" style="margin-top:10px;">Waiting for them to join...</div>
      ${localWarning}
      <div class="hint" style="margin-top:12px;">Joining someone else instead? Enter their code:</div>
      <div class="manual-row" style="margin-top:4px;"><input id="nearbyCodeInput" placeholder="Their code" maxlength="4" inputmode="numeric" style="flex:1;border-radius:10px;border:2px solid #0d2027;padding:9px 10px;font-family:'Press Start 2P';font-size:12px;text-align:center;"></div>
      <div class="buttons-row"><button class="btn yolk small full" id="nearbyConnectBtn">Pair</button></div>
      <div class="buttons-row"><button class="btn cream small full" id="nearbyLeaveBtn2">Cancel</button></div>`;
    document.getElementById('nearbyConnectBtn').addEventListener('click', ()=>{
      const v = document.getElementById('nearbyCodeInput').value.trim();
      if(!/^\d{4}$/.test(v)){ showToast("Enter a 4-digit pairing code"); return; }
      nearbyMyOwnCode=null;
      connectNearby(v, panel);
    });
    document.getElementById('nearbyLeaveBtn2').addEventListener('click', ()=>{ nearbyMyOwnCode=null; leaveNearby(); });
    return;
  }
  renderNearbyActive(panel);
}
async function connectNearby(code, panel){
  let doc = await fetchNearbyDoc(code);
  if(versusCategory!=='nearby') return; // player navigated away while this was in flight - don't let a stale response overwrite whatever screen they're on now
  if(!doc){
    doc = { host:{present:true, name:state.hunterName||'Hunter', streak:state.stats.pvpCurrentStreak||0}, guest:{present:false, name:null, streak:0}, trade:{host:blankTradeSide(), guest:blankTradeSide(), stage:1}, battle:{host:blankBattleSide(), guest:blankBattleSide(), resultLog:null, hostWon:null, seed:null}, updatedAt:Date.now() };
    nearbyRole='host';
  } else if(!doc.guest.present){ doc.guest.present=true; doc.guest.name=state.hunterName||'Hunter'; doc.guest.streak=state.stats.pvpCurrentStreak||0; nearbyRole='guest'; }
  else if(!doc.host.present){ doc.host.present=true; doc.host.name=state.hunterName||'Hunter'; doc.host.streak=state.stats.pvpCurrentStreak||0; nearbyRole='host'; }
  else { showToast("That code already has two players connected - try another"); return; }
  await saveNearbyDocRaw(code, doc);
  if(versusCategory!=='nearby') return; // check again - the second await is another window for the player to have left
  nearbyCode=code; nearbyDoc=doc; nearbyAppliedLocally=false;
  ensureNearbyPolling(panel);
  renderNearbyActive(panel);
}
async function sendTradeInvite(targetPlayerId, targetName){
  const myId = ensurePlayerId();
  const sessionCode = 'TR'+Math.random().toString(36).slice(2,10).toUpperCase();
  try{
    await storageSet('tradeInvite:'+targetPlayerId, JSON.stringify({fromId:myId, fromName:state.hunterName||'Hunter', sessionCode, accepted:false, timestamp:Date.now()}), true);
    return sessionCode;
  }catch(e){ return null; }
}
async function checkIncomingTradeInvite(){
  const myId = ensurePlayerId();
  try{
    const res = await storageGet('tradeInvite:'+myId, true);
    if(res && res.value){
      const req = JSON.parse(res.value);
      if(Date.now()-req.timestamp < 5*60000) return req; // ignore anything stale (over 5 minutes old) rather than resurrect a long-dead invite
    }
  }catch(e){}
  return null;
}
async function declineTradeInvite(){
  try{ await storageDelete('tradeInvite:'+ensurePlayerId(), true); }catch(e){}
}
async function acceptTradeInvite(req){
  try{
    req.accepted = true;
    await storageSet('tradeInvite:'+ensurePlayerId(), JSON.stringify(req), true);
  }catch(e){}
}
// Routes either side of an accepted trade invite straight into a live pairing session, the same
// way an accepted battle request does - the session code was already exchanged silently through
// Firebase, no manual code entry needed. Lands on the existing Trade/Battle toggle screen, so both
// activities remain available once paired regardless of which one the invite was originally for.
function enterTradeSession(sessionCode, panel){
  nearbySubMode = 'trade';
  currentTab = 'versus';
  versusCategory = 'nearby';
  connectNearby(sessionCode, panel);
}
function showTradeInviteWaiting(targetPlayerId, targetName){
  const overlay = document.createElement('div'); overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal-box" style="text-align:center;">
    <div class="pixel sm">Sending trade invite to ${escapeHtml(targetName)}...</div>
    <div class="hint" id="tiWaitStatus" style="margin-top:8px;">Waiting for them to accept...</div>
    <div class="buttons-row"><button class="btn cream small full" id="tiWaitCancel">Cancel</button></div>
  </div>`;
  document.body.appendChild(overlay);
  let cancelled = false;
  let pollTimer = null;
  document.getElementById('tiWaitCancel').addEventListener('click', async ()=>{
    cancelled = true;
    clearInterval(pollTimer);
    try{ await storageDelete('tradeInvite:'+targetPlayerId, true); }catch(e){}
    overlay.remove();
  });
  (async ()=>{
    const sessionCode = await sendTradeInvite(targetPlayerId, targetName);
    if(!sessionCode || cancelled){ if(!cancelled){ showToast("Couldn't send that invite - try again"); overlay.remove(); } return; }
    pollTimer = setInterval(async ()=>{
      if(cancelled){ clearInterval(pollTimer); return; }
      try{
        const res = await storageGet('tradeInvite:'+targetPlayerId, true);
        if(!res || !res.value){ clearInterval(pollTimer); if(!cancelled){ showToast(`${targetName} declined`); overlay.remove(); } return; }
        const req = JSON.parse(res.value);
        if(req.accepted){
          clearInterval(pollTimer);
          overlay.remove();
          enterTradeSession(sessionCode, document.getElementById('panel'));
        }
      }catch(e){}
    }, 2000);
  })();
}
async function sendBattleRequest(targetPlayerId, targetName){
  const myId = ensurePlayerId();
  const sessionCode = 'BR'+Math.random().toString(36).slice(2,10).toUpperCase();
  try{
    await storageSet('battleRequest:'+targetPlayerId, JSON.stringify({fromId:myId, fromName:state.hunterName||'Hunter', sessionCode, accepted:false, timestamp:Date.now()}), true);
    return sessionCode;
  }catch(e){ return null; }
}
async function listLineup(){
  if(HAS_CLAUDE_STORAGE){
    try{

async function evaluateNearbyTradeAndSave(){
  const doc = nearbyDoc; if(!doc) return;
  const mine = mySide(doc,'trade'), theirs = theirSide(doc,'trade');
  let changed = false;
  if(mine.accepted && theirs.accepted){
    if(doc.trade.stage===1){ doc.trade.stage=2; mine.accepted=false; theirs.accepted=false; changed=true; }
    else if(doc.trade.stage===2 && !mine.applied){
      if(mine.offerMonster) state.collection = state.collection.filter(m=>m.id!==mine.offerMonster.id);
      if(mine.offerItemKey && mine.offerItemQty>0){ state.inventory[mine.offerItemKey] = Math.max(0,(state.inventory[mine.offerItemKey]||0)-mine.offerItemQty); }
      if(theirs.offerMonster){
        if(!squadFull()){
          const incoming=JSON.parse(JSON.stringify(theirs.offerMonster));
          incoming.id=incoming.barcode+'-nb-'+Date.now();
          // Another device wrote this, and could have bypassed its own client's rename filters
          // entirely - sanitize now so every future render of this monster is already safe.
          incoming.name = String(incoming.name||'').replace(/[^a-zA-Z0-9 ]/g,'').slice(0,15) || 'Traded Skrambeast';
          incoming.defaultName = incoming.name;
          state.collection.push(incoming);
        }
        else showToast("Your squad is full - couldn't receive their Skrambeast");
      }
      if(theirs.offerItemKey && theirs.offerItemQty>0){ state.inventory[theirs.offerItemKey] = (state.inventory[theirs.offerItemKey]||0)+theirs.offerItemQty; }
      state.coins = clampCoins(state.coins - mine.offerCoins + theirs.offerCoins);
      state.stats.tradesCompleted = (state.stats.tradesCompleted||0)+1;
      saveState(); mine.applied=true; changed=true; showToast("Trade complete!");
      if(theirs.applied){ doc.trade = { host:blankTradeSide(), guest:blankTradeSide(), stage:1 }; changed=true; }
    }
  }
  // Only write back when we actually changed something - a routine poll that
  // finds nothing new must NOT resave, or it can race the other player's
  // write (e.g. their join) and silently overwrite it with a stale copy.
  if(changed) await saveNearbyDocRaw(nearbyCode, doc);
}

function duelScore(result){ return result.defeatedCount*1000 + result.survivingHp; }
function evaluateNearbyBattle(){
  const doc = nearbyDoc; if(!doc || !doc.battle) return;
  const h = doc.battle.host, g = doc.battle.guest;
  if(h.ready && g.ready && h.myResult && g.myResult && !nearbyAppliedLocally){
    const mine = nearbyRole==='host'? h : g;
    const theirs = nearbyRole==='host'? g : h;
    const myScore = duelScore(mine.myResult), theirScore = duelScore(theirs.myResult);
    const myWon = myScore > theirScore;
    const isTie = myScore === theirScore;
    const mySnap = mine.team;
    const myTeamObjs = mySnap.map(snap=> state.collection.find(m=>m.id===snap.id)).filter(Boolean);
    myTeamObjs.forEach(m=>{ grantXP(m, (myWon||isTie)? xpReward(m.level+3,'uncommon') : Math.round(xpReward(m.level+3,'uncommon')*0.3)); markTired(m); });
    const coinReward = myWon ? 200 : (isTie ? 100 : 60);
    const hunterXpReward = myWon ? 15 : (isTie ? 8 : 5);
    addCoins(coinReward); addHunterXP(hunterXpReward);
    if(!state.stats.pvpWins) state.stats.pvpWins = 0;
    if(!state.stats.pvpLosses) state.stats.pvpLosses = 0;
    if(!state.stats.pvpTies) state.stats.pvpTies = 0;
    if(myWon){
      state.stats.pvpWins++;
      state.stats.pvpCurrentStreak = (state.stats.pvpCurrentStreak||0)+1;
      state.stats.pvpBestStreak = Math.max(state.stats.pvpBestStreak||0, state.stats.pvpCurrentStreak);
    } else {
      if(isTie) state.stats.pvpTies++; else state.stats.pvpLosses++;
      state.stats.pvpCurrentStreak = 0;
    }
    saveState();
    nearbyAppliedLocally = true;
    state.battlesSinceBoss = (state.battlesSinceBoss||0)+1;
    state.lifetimeBattlesTowardBoss = (state.lifetimeBattlesTowardBoss||0)+1;
    saveState();
    checkAchievements();
    maybeTriggerBoss();
  }
}

      doc.battle = { host:blankBattleSide(), guest:blankBattleSide(), resultLog:null, hostWon:null, seed:null };
      nearbyMyBattleTeam=[]; nearbyAppliedLocally=false; nearbyDuelInProgress=false;
      await saveNearbyDocRaw(nearbyCode, doc);
      renderNearbyBattle(container, panel);
    });
    return;
  }
  if(mine.ready && theirs.ready && mine.myResult && !theirs.myResult){
    renderNearbyWaiting(container, `You defeated ${mine.myResult.defeatedCount}/5. Waiting for the other player to finish their fight...`, theirs);
    return;
  }
  if(mine.ready && theirs.ready && !mine.myResult){
    if(nearbyDuelInProgress) return;
    if(theirs.team.length===0){ renderNearbyWaiting(container, "Waiting for the other player's team...", theirs); return; }
    nearbyDuelInProgress = true;
    startNearbyDuelBattle(nearbyMyBattleTeam.map(id=> state.collection.find(m=>m.id===id)), theirs.team, container, async (result)=>{
      mine.myResult = { defeatedCount: result.defeatedCount, survivingHp: result.survivingHp, log: result.log };
      await saveNearbyDocRaw(nearbyCode, doc);
      nearbyDuelInProgress = false;
      evaluateNearbyBattle();
      renderNearbyBattle(container, panel);
    });
    return;
  }
  container.innerHTML = `<div id="nbTeamPicker"></div><div class="hint" style="text-align:center;">Most monsters defeated wins - HP left is only the tiebreaker.</div><div class="hint">${mine.ready?'Waiting for the other player...':'Pick your team, then Ready Up.'}</div><div class="buttons-row"><button class="btn ${mine.ready?'yolk':'coral'} small full" id="nbReadyBtn">${mine.ready?'Ready':'Ready Up'}</button></div>`;
  renderTeamPicker(document.getElementById('nbTeamPicker'), favoritedSquad().length?favoritedSquad():state.collection, nearbyMyBattleTeam, ()=> renderNearbyBattle(container, panel));
  document.getElementById('nbReadyBtn').addEventListener('click', async ()=>{
    if(nearbyMyBattleTeam.length===0){ showToast("Pick at least one Skrambeast"); return; }
    mine.team = nearbyMyBattleTeam.map(id=> state.collection.find(m=>m.id===id));
    mine.ready = true;
    mine.lastActiveAt = Date.now();
    await saveNearbyDocRaw(nearbyCode, doc);
    renderNearbyBattle(container, panel);
  });
}

}
function showToast(msg){

/* =========================================================

========================================================= */
const TAB_ORDER = ['scan','collection','store','almanac','versus'];
(function setupTabSwipe(){
  let startX=null, startY=null, startTarget=null;
  const root = document.querySelector('.device');
  root.addEventListener('touchstart', e=>{
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; startTarget = e.target;
  }, {passive:true});
  root.addEventListener('touchend', e=>{
    if(startX===null) return;
    if(startTarget && startTarget.closest && (startTarget.closest('.tile-grid') || startTarget.closest('.modal-overlay'))){ startX=null; return; }
    const dx = e.changedTouches[0].clientX-startX, dy = e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){
      const idx = TAB_ORDER.indexOf(currentTab);
      if(dx<0 && idx<TAB_ORDER.length-1) switchTab(TAB_ORDER[idx+1]);
      else if(dx>0 && idx>0) switchTab(TAB_ORDER[idx-1]);
    }
    startX=null;
  }, {passive:true});
})();

function isProfane(name){ const l=name.toLowerCase(); return PROFANITY_LIST.some(w=>l.includes(w)); }

function showOnboarding(){

  typeLines(WELCOME_LINES, document.getElementById('onboardText'), showNameAndSetup);
}
function typeLines(lines, el, onDone){
  el.innerHTML=''; let li=0; let skip=false;
  const skipNow = ()=>{ skip=true; };
  document.addEventListener('click', skipNow);
  const typeNext = ()=>{
    if(li>=lines.length){
      document.removeEventListener('click', skipNow);
      const prompt = document.createElement('div');
      prompt.className = 'pixel sm prompt-pulse';
      prompt.style.cssText = 'text-align:center; margin-top:14px;';
      prompt.textContent = 'Tap to continue';
      el.appendChild(prompt);
      el.scrollTop = el.scrollHeight;
      const goNow = ()=>{ document.removeEventListener('click', goNow); onDone(); };
      document.addEventListener('click', goNow);
      return;
    }
    const line=lines[li]; let ci=0;
    const lineEl=document.createElement('div'); lineEl.style.marginBottom='8px'; el.appendChild(lineEl);
    const typeChar = ()=>{
      if(skip){ lineEl.textContent=line; li++; skip=false; el.scrollTop = el.scrollHeight; setTimeout(typeNext,250); return; }
      if(ci<=line.length){ lineEl.textContent=line.slice(0,ci); ci++; el.scrollTop = el.scrollHeight; setTimeout(typeChar,32); }
      else { li++; setTimeout(typeNext,350); }
    };
    typeChar();
  };
  typeNext();
}
function showNameAndSetup(){
  idleScreen(); // real scan-line + shell now visible as a live preview, matching the CUSTOMIZE YOUR SCANNER message this shows while scannerSetupActive is true
  applyScannerCustomization();
  const panel = document.getElementById('panel');
  const refresh = ()=>{ idleScreen(); applyScannerCustomization(); render(); };
  const render = ()=>{
    const nameVal = document.getElementById('hunterNameInput') ? document.getElementById('hunterNameInput').value : '';
    panel.innerHTML = `
      <div class="top-bar"><div class="pixel sm">SET UP YOUR SCANNER</div></div>
      <input id="hunterNameInput" maxlength="15" placeholder="Enter your hunter name" value="${nameVal}" style="width:100%;border-radius:10px;border:2px solid #0d2027;padding:8px 10px;font-family:'Baloo 2';font-size:15px;text-align:center;box-sizing:border-box;margin-top:4px;">
      <div class="hint" style="margin-top:8px;">Shell colour</div>
      <div class="buttons-row" id="shellSwatches" style="margin-top:0;flex-wrap:wrap;justify-content:flex-start;gap:4px;"></div>
      <div class="hint" style="margin-top:6px;">Laser colour${SCANNER_SKINS.some(s=>s.key===state.scannerCustomization.shell)?' (Fixed by your current skin)':''}</div>
      <div class="buttons-row" id="laserSwatches" style="margin-top:0;flex-wrap:wrap;justify-content:flex-start;gap:4px;"></div>
      <div class="hint" style="margin-top:6px;">Laser direction</div>
      <div class="buttons-row" style="margin-top:0;">
        <button class="btn tiny ${state.scannerCustomization.orientation==='horizontal'?'yolk':'cream'}" id="orientH">Horizontal</button>
        <button class="btn tiny ${state.scannerCustomization.orientation==='vertical'?'yolk':'cream'}" id="orientV">Vertical</button>
      </div>
      <div class="buttons-row" style="margin-top:10px;"><button class="btn yolk small full" id="onboardGo">Start Hunting</button></div>`;
    document.getElementById('shellSwatches').innerHTML = shellSwatchesHTML();
    document.getElementById('laserSwatches').innerHTML = LASER_COLORS.map(l=> `<button class="btn tiny ${state.scannerCustomization.laser===l.key?'yolk':'cream'}" data-laser="${l.key}">${l.name}</button>`).join('');
    wireShellSwatches(refresh);
    document.querySelectorAll('[data-laser]').forEach(b=> b.addEventListener('click', ()=>{ state.scannerCustomization.laser=b.dataset.laser; saveState(); refresh(); }));
    document.getElementById('orientH').addEventListener('click', ()=>{ state.scannerCustomization.orientation='horizontal'; saveState(); refresh(); });
    document.getElementById('orientV').addEventListener('click', ()=>{ state.scannerCustomization.orientation='vertical'; saveState(); refresh(); });
    const input = document.getElementById('hunterNameInput');
    input.addEventListener('paste', e=> e.preventDefault());
    input.addEventListener('input', ()=>{ input.value = input.value.replace(/[^a-zA-Z0-9]/g,'').slice(0,15); });
    document.getElementById('onboardGo').addEventListener('click', async ()=>{
      const name = input.value.trim();
      if(!name){ showToast("Enter a name to continue"); return; }
      if(isProfane(name)){ showToast("Please choose a different name"); return; }
      const goBtn = document.getElementById('onboardGo');
      goBtn.disabled = true;
      const result = await changeUsername(name);
      if(!result.ok){ showToast(result.message); goBtn.disabled = false; return; }
      panel.innerHTML = '';
      screenEl.innerHTML = `<div id="onboardText" class="pixel sm" style="width:100%;box-sizing:border-box;text-align:left;line-height:1.7;font-size:11px;max-height:100%;overflow-y:auto;padding:6px 2px;"></div>`;
      typeLines(thanksLines(name), document.getElementById('onboardText'), ()=>{
        scannerSetupActive = false;
        document.body.classList.remove('scanner-setup-lock');
        screenEl.innerHTML = '';
        renderTab();
        if(!state.hasSeenTabTour) setTimeout(startTabTour, 400);
      });
    });
  };
  render();
}
