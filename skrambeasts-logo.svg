<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c3d4c"/>
      <stop offset="100%" stop-color="#0f2129"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d3ddb9"/>
      <stop offset="100%" stop-color="#c0cd9d"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background badge -->
  <rect width="1024" height="1024" rx="205" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="205" fill="none" stroke="#0a171d" stroke-width="6"/>

  <!-- Bezel bolts -->
  <circle cx="184" cy="184" r="41" fill="#0a171d"/>
  <circle cx="184" cy="184" r="41" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="3"/>
  <circle cx="840" cy="184" r="41" fill="#0a171d"/>
  <circle cx="840" cy="184" r="41" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Screen -->
  <g filter="url(#softShadow)">
    <rect x="143" y="246" width="738" height="594" rx="102" fill="url(#screenGrad)" stroke="#0a171d" stroke-width="20"/>
  </g>

  <!-- Scan line -->
  <rect x="143" y="522" width="738" height="41" fill="#E8542E"/>
  <rect x="143" y="522" width="738" height="10" fill="#ff7a52" opacity="0.55"/>

  <!-- Crosshair / scan target -->
  <circle cx="512" cy="543" r="154" fill="none" stroke="#16323E" stroke-width="41"/>
  <line x1="512" y1="307" x2="512" y2="389" stroke="#16323E" stroke-width="41" stroke-linecap="round"/>
  <line x1="512" y1="697" x2="512" y2="779" stroke="#16323E" stroke-width="41" stroke-linecap="round"/>
  <line x1="277" y1="543" x2="359" y2="543" stroke="#16323E" stroke-width="41" stroke-linecap="round"/>
  <line x1="665" y1="543" x2="747" y2="543" stroke="#16323E" stroke-width="41" stroke-linecap="round"/>
  <circle cx="512" cy="543" r="36" fill="#16323E"/>
</svg>
